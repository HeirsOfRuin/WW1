# Builds the Android app (the itch.io download) on every push that changes the game, and on demand
# (Actions > Android app > Run workflow). The APK is attached to the run as an artifact:
# Actions > Android app > the run > Artifacts > in-the-trenches-android. docs/ANDROID.md.
# Signing: repository secrets ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD. Without them it
# builds a TEST APK with a throwaway key, which will not install over a copy from another build.
# (game-release templates/android, as Knight of Adalia's.)
name: Android app

on:
  push:
    branches: [main, ccr-16c6eed4-w433t4]
    paths: [src/**, content/**, public/**, android/**, tools/**, index.html, package.json, package-lock.json, capacitor.config.ts, vite.config.ts, .github/workflows/android.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run build
      # the app's files are on the phone: no service worker (as the itch zip)
      - run: rm -f dist/sw.js
      - run: npx cap sync android
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing key in the repository secrets: this is a test APK only. See docs/ANDROID.md."
          fi
      - name: Build the APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          if [ -n "$ANDROID_KEYSTORE_FILE" ]; then
            ./gradlew --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk ../in-the-trenches.apk
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../in-the-trenches-TEST.apk
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: in-the-trenches-android
          path: 'in-the-trenches*.apk'
          retention-days: 30
