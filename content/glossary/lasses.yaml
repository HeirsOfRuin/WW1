# Words in content/scenes/war/lasses.yaml (docs/FRAME-WORDS.md sections 1 and 2). Format as base.yaml.
# A word also listed in another glossary file keeps whichever meaning is loaded first.
- { term: Boulangerie, means: "French for a baker's shop; the word over the door." }
- { term: napoo, means: "Soldiers' French, from 'il n'y en a plus': finished, none left, gone." }
- { term: mamzelle, means: "Soldiers' French for mademoiselle: miss, a young woman." }
- { term: "tray bon", means: "Soldiers' French for 'très bon': very good." }
- { term: "merci boko", means: "Soldiers' French for 'merci beaucoup': thank you very much." }
- { term: sous, means: "Small French coins. A sou was five centimes, about a halfpenny; twenty made a franc." }
- { term: Jerry, means: "Soldiers' name for the Germans, or one German, in the last two years of the war." }
- { term: dixie, also: [dixies], means: "A large iron cooking pot with a lid; the company's stew and tea came up the line in them." }
- { term: billet, also: [billets, billeted], means: "A house, barn or school where soldiers were lodged behind the line; to be lodged in one." }
- { term: calvary, means: "A roadside cross with the figure of Christ on it, common at French crossroads." }
- { term: "clearing station", also: ["casualty clearing station"], means: "A casualty clearing station: a hospital of tents and huts at a railhead, the first with nursing sisters." }
- { term: "sick parade", means: "The morning line of men reporting sick to the medical officer." }
- { term: chit, means: "A note or slip of paper giving an order or permission." }
- { term: limbers, means: "Two-wheeled horse-drawn carts that carried a battalion's ammunition and stores." }
- { term: salient, means: "A bulge in the line with the enemy on three sides; 'the salient' meant the one round Ypres." }
- { term: Gothas, means: "Big German twin-engined bombing aeroplanes, used from 1917, mostly at night." }
- { term: "town major", means: "The officer in charge of billets and order in a town behind the line." }
- { term: WAACs, also: [WAAC], means: "Women of the Women's Army Auxiliary Corps, formed 1917: clerks, cooks and drivers at the bases." }
- { term: "lance jack", means: "Soldiers' name for a lance corporal, the lowest rank with a stripe." }
- { term: "the peel", means: "A baker's long-handled wooden shovel for putting loaves into the oven and drawing them out." }
- { term: dope, means: "The varnish painted on an aeroplane's fabric wings to tighten them; it smelled of pear drops." }
- { term: Fermé, means: "French for closed, shut." }
