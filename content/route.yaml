# The war's route: where every `next: "@war"` goes (tools/content-loader.ts substitutes it).
# First match wins. Authored scenes that take over a question for a moment of the war go ABOVE
# the generic scene for that question; endings come first.
switch:
  - { if: "war.ending == killed", go: e_killed }
  - { if: "war.ending == armistice", go: e_armistice }
  - { if: "war.ending == posting", go: e_posting }
  - { if: "war.ending == captured", go: e_captured }
  - { if: "war.ending == invalided", go: e_invalided }
  - { if: "war.ending == broken", go: e_broken }
  - { if: "war.ending == court_martial", go: e_court }
  # what just happened, before anything else is asked (content/scenes/war/news.yaml)
  - { if: "war.wound == light", go: x_wound_light }
  - { if: "war.wound == severe", go: x_wound_severe }
  - { if: ["war.fallen == 1", "start == mill"], go: x_fallen_shaw }
  - { if: ["war.fallen == 2", "start == mill"], go: x_fallen_duckworth }
  - { if: ["war.fallen == 3", "start == mill"], go: x_fallen_pilling }
  - { if: "war.fallen >= 1", go: x_fallen }
  # how a sortie went, then its next step (content/scenes/war/sorties.yaml)
  - { if: "war.result != none", go: x_sortie }
  - { if: "war.pending == step", go: w_step }
  # authored moments (calibration, the mill town 1915)
  # front-line events: at the first call for men each tour, one from the pool if one is due;
  # each is once, and requires says when (an empty draw goes straight to the duty)
  - { if: ["war.pending == duty", "war.call == 1", "war.stage == 1", "start == mill"], go: { pool: front_1915_mill, count: 1, then: w_duty } }
  - { if: ["war.battle == loos", "war.phase == 1", "war.path == rifleman"], go: b_loos_advance }
  - { if: ["war.battle == loos", "war.phase == 2", "war.path == rifleman"], go: b_loos_trench }
  - { if: ["war.battle == loos", "war.phase == 3", "war.path == rifleman"], go: b_loos_hold }
  - { if: ["war.pending == leave", "war.stage == 1", "start == mill"], go: l_mill_1915 }
  # the mill town, 1916 (docs/FRAME-1916.md)
  - { if: ["war.pending == duty", "war.call == 1", "war.stage == 2", "start == mill"], go: { pool: front_1916_mill, count: 1, then: w_duty } }
  - { if: ["war.battle == somme_1_july", "war.phase == 1", "start == mill"], go: b_somme_1 }
  - { if: ["war.battle == somme_1_july", "war.phase == 2", "start == mill"], go: b_somme_2 }
  - { if: ["war.battle == somme_1_july", "war.phase == 3", "start == mill"], go: b_somme_3 }
  - { if: ["war.battle == somme_1_july", "war.phase == 4", "start == mill"], go: b_somme_4 }
  - { if: ["war.battle == somme_autumn", "war.phase == 1", "start == mill"], go: b_somme_autumn_1 }
  - { if: ["war.battle == somme_autumn", "war.phase == 2", "start == mill"], go: b_somme_autumn_2 }
  - { if: ["war.battle == somme_autumn", "war.phase == 3", "start == mill"], go: b_somme_autumn_3 }
  - { if: ["war.pending == leave", "war.stage == 2", "start == mill"], go: l_mill_1916 }
  # the war's questions
  - { if: "war.pending == tunnel", go: w_tunnel }
  - { if: "war.pending == duty", go: w_duty }
  - { if: "war.pending == mission", go: w_mission }
  - { if: "war.pending == sick", go: w_sick }
  - { if: "war.pending == course", go: w_course }
  - { if: "war.pending == battle", go: w_battle }
  - { if: "war.pending == leave", go: w_leave }
default: e_error
