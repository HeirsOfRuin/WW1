# The war's route: where every `next: "@war"` goes (tools/content-loader.ts substitutes it).
# First match wins. Authored scenes that take over a question for a moment of the war go ABOVE
# the generic scene for that question; endings come first.
switch:
  - { if: "war.ending == killed", go: e_killed }
  - { if: ["war.ending == armistice", "start == mill"], go: e_armistice_mill }
  - { if: "war.ending == armistice", go: e_armistice }
  - { if: "war.ending == posting", go: e_posting }
  - { if: "war.ending == captured", go: e_captured }
  - { if: "war.ending == invalided", go: e_invalided }
  - { if: "war.ending == broken", go: e_broken }
  - { if: "war.ending == court_martial", go: e_court }
  # what just happened, before anything else is asked (content/scenes/war/news.yaml)
  - { if: "war.wound == light", go: x_wound_light }
  - { if: "war.wound == severe", go: x_wound_severe }
  - { if: ["war.fallen == 1", "start == mill"], go: x_fallen_shaw }
  - { if: ["war.fallen == 2", "start == mill"], go: x_fallen_duckworth }
  - { if: ["war.fallen == 3", "start == mill"], go: x_fallen_pilling }
  - { if: ["war.fallen == 1", "start == pit"], go: x_fallen_robson }
  - { if: ["war.fallen == 2", "start == pit"], go: x_fallen_bell }
  - { if: ["war.fallen == 3", "start == pit"], go: x_fallen_charlton }
  - { if: "war.fallen >= 1", go: x_fallen }
  # how a sortie went, then its next step (content/scenes/war/sorties.yaml)
  - { if: ["war.result != none", "war.result_key == raid"], go: x_raid_done }
  - { if: ["war.result != none", "war.result_key == patrol"], go: x_patrol_done }
  - { if: ["war.result != none", "war.result_key == wiring"], go: x_wiring_done }
  - { if: ["war.result != none", "war.result_key == listening"], go: x_listening_done }
  - { if: ["war.result != none", "war.result_key == carrying"], go: x_carrying_done }
  - { if: ["war.result != none", "war.result_key == bomb"], go: x_bomb_done }
  - { if: ["war.result != none", "war.result_key == lewis"], go: x_lewis_done }
  - { if: ["war.result != none", "war.result_key == snipe"], go: x_snipe_done }
  - { if: ["war.result != none", "war.result_key == signals"], go: x_signals_done }
  - { if: ["war.result != none", "war.result_key == tunnel"], go: x_tunnel_done }
  - { if: "war.result != none", go: x_sortie }
  - { if: ["war.sortie == raid", "war.step == 1"], go: s_raid_1 }
  - { if: ["war.sortie == raid", "war.step == 2"], go: s_raid_2 }
  - { if: ["war.sortie == raid", "war.step == 3"], go: s_raid_3 }
  - { if: ["war.sortie == patrol", "war.step == 1"], go: s_patrol_1 }
  - { if: ["war.sortie == patrol", "war.step == 2"], go: s_patrol_2 }
  - { if: ["war.sortie == patrol", "war.step == 3"], go: s_patrol_3 }
  - { if: ["war.sortie == wiring", "war.step == 1"], go: s_wiring_1 }
  - { if: ["war.sortie == wiring", "war.step == 2"], go: s_wiring_2 }
  - { if: ["war.sortie == wiring", "war.step == 3"], go: s_wiring_3 }
  - { if: ["war.sortie == listening", "war.step == 1"], go: s_listening_1 }
  - { if: ["war.sortie == listening", "war.step == 2"], go: s_listening_2 }
  - { if: ["war.sortie == listening", "war.step == 3"], go: s_listening_3 }
  - { if: ["war.sortie == carrying", "war.step == 1"], go: s_carrying_1 }
  - { if: ["war.sortie == carrying", "war.step == 2"], go: s_carrying_2 }
  - { if: ["war.sortie == carrying", "war.step == 3"], go: s_carrying_3 }
  - { if: ["war.sortie == bomb", "war.step == 1"], go: s_bomb_1 }
  - { if: ["war.sortie == bomb", "war.step == 2"], go: s_bomb_2 }
  - { if: ["war.sortie == bomb", "war.step == 3"], go: s_bomb_3 }
  - { if: ["war.sortie == lewis", "war.step == 1"], go: s_lewis_1 }
  - { if: ["war.sortie == lewis", "war.step == 2"], go: s_lewis_2 }
  - { if: ["war.sortie == lewis", "war.step == 3"], go: s_lewis_3 }
  - { if: ["war.sortie == snipe", "war.step == 1"], go: s_snipe_1 }
  - { if: ["war.sortie == snipe", "war.step == 2"], go: s_snipe_2 }
  - { if: ["war.sortie == snipe", "war.step == 3"], go: s_snipe_3 }
  - { if: ["war.sortie == signals", "war.step == 1"], go: s_signals_1 }
  - { if: ["war.sortie == signals", "war.step == 2"], go: s_signals_2 }
  - { if: ["war.sortie == signals", "war.step == 3"], go: s_signals_3 }
  - { if: ["war.sortie == tunnel", "war.step == 1"], go: s_tunnel_1 }
  - { if: ["war.sortie == tunnel", "war.step == 2"], go: s_tunnel_2 }
  - { if: ["war.sortie == tunnel", "war.step == 3"], go: s_tunnel_3 }
  - { if: "war.pending == step", go: w_step }
  # a title page for each year, at the first tour of the year (content/scenes/war/years.yaml)
  - { if: ["war.pending == tour", "war.stage == 1", { not: flag.year_1915 }], go: y_1915 }
  - { if: ["war.pending == tour", "war.stage == 2", { not: flag.year_1916 }], go: y_1916 }
  - { if: ["war.pending == tour", "war.stage == 3", { not: flag.year_1917 }], go: y_1917 }
  - { if: ["war.pending == tour", "war.stage == 4", { not: flag.year_1918 }], go: y_1918 }
  # the pit town, 1915 (content/scenes/war/1915-pit.yaml; docs/FRAME-PIT-1915.md): above the mill's
  # Loos, which is routed by path only
  - { if: ["war.pending == tour", "war.stage == 1", "start == pit"], go: { pool: front_1915_pit, count: 1, then: w_tour } }
  - { if: ["war.battle == loos", "war.phase == 1", "start == pit"], go: b_loos_pit_advance }
  - { if: ["war.battle == loos", "war.phase == 2", "start == pit"], go: b_loos_pit_trench }
  - { if: ["war.battle == loos", "war.phase == 3", "start == pit"], go: b_loos_pit_hold }
  - { if: ["war.pending == leave", "war.stage == 1", "start == pit"], go: l_pit_1915 }
  - { if: ["war.pending == tunnel", "start == pit"], go: w_tunnel_pit }
  # authored moments (calibration, the mill town 1915)
  # front-line events: at the start of each tour, one from the pool if one is due;
  # each is once, and requires says when (an empty draw goes straight to the duty)
  - { if: ["war.pending == tour", "war.stage == 1", "start == mill"], go: { pool: front_1915_mill, count: 1, then: w_tour } }
  - { if: ["war.battle == loos", "war.phase == 1", "war.path == rifleman"], go: b_loos_advance }
  - { if: ["war.battle == loos", "war.phase == 2", "war.path == rifleman"], go: b_loos_trench }
  - { if: ["war.battle == loos", "war.phase == 3", "war.path == rifleman"], go: b_loos_hold }
  - { if: ["war.pending == leave", "war.stage == 1", "start == mill"], go: l_mill_1915 }
  # the mill town, 1916 (docs/FRAME-1916.md)
  - { if: ["war.pending == tour", "war.stage == 2", "start == mill"], go: { pool: front_1916_mill, count: 1, then: w_tour } }
  - { if: ["war.battle == somme_1_july", "war.phase == 1", "start == mill"], go: b_somme_1 }
  - { if: ["war.battle == somme_1_july", "war.phase == 2", "start == mill"], go: b_somme_2 }
  - { if: ["war.battle == somme_1_july", "war.phase == 3", "start == mill"], go: b_somme_3 }
  - { if: ["war.battle == somme_1_july", "war.phase == 4", "start == mill"], go: b_somme_4 }
  - { if: ["war.battle == somme_autumn", "war.phase == 1", "start == mill"], go: b_somme_autumn_1 }
  - { if: ["war.battle == somme_autumn", "war.phase == 2", "start == mill"], go: b_somme_autumn_2 }
  - { if: ["war.battle == somme_autumn", "war.phase == 3", "start == mill"], go: b_somme_autumn_3 }
  - { if: ["war.pending == leave", "war.stage == 2", "start == mill"], go: l_mill_1916 }
  # the mill town, 1917 (content/scenes/war/1917-mill.yaml)
  - { if: ["war.pending == tour", "war.stage == 3", "start == mill"], go: { pool: front_1917_mill, count: 1, then: w_tour } }
  - { if: ["war.battle == arras", "war.phase == 1", "start == mill"], go: b_arras_1 }
  - { if: ["war.battle == arras", "war.phase == 2", "start == mill"], go: b_arras_2 }
  - { if: ["war.battle == arras", "war.phase == 3", "start == mill"], go: b_arras_3 }
  - { if: ["war.battle == passchendaele", "war.phase == 1", "start == mill"], go: b_pass_1 }
  - { if: ["war.battle == passchendaele", "war.phase == 2", "start == mill"], go: b_pass_2 }
  - { if: ["war.battle == passchendaele", "war.phase == 3", "start == mill"], go: b_pass_3 }
  - { if: ["war.battle == passchendaele", "war.phase == 4", "start == mill"], go: b_pass_4 }
  - { if: ["war.pending == leave", "war.stage == 3", "start == mill"], go: l_mill_1917 }
  # the mill town, 1918 (content/scenes/war/1918-mill.yaml; docs/FRAME-1918.md)
  - { if: ["war.pending == tour", "war.stage == 4", "start == mill"], go: { pool: front_1918_mill, count: 1, then: w_tour } }
  - { if: ["war.battle == spring_offensive", "war.phase == 1", "start == mill"], go: b_spring_1 }
  - { if: ["war.battle == spring_offensive", "war.phase == 2", "start == mill"], go: b_spring_2 }
  - { if: ["war.battle == spring_offensive", "war.phase == 3", "start == mill"], go: b_spring_3 }
  - { if: ["war.battle == spring_offensive", "war.phase == 4", "start == mill"], go: b_spring_4 }
  - { if: ["war.battle == hundred_days_august", "war.phase == 1", "start == mill"], go: b_amiens_1 }
  - { if: ["war.battle == hundred_days_august", "war.phase == 2", "start == mill"], go: b_amiens_2 }
  - { if: ["war.battle == hundred_days_august", "war.phase == 3", "start == mill"], go: b_amiens_3 }
  - { if: ["war.battle == hundred_days_october", "war.phase == 1", "start == mill"], go: b_oct_1 }
  - { if: ["war.battle == hundred_days_october", "war.phase == 2", "start == mill"], go: b_oct_2 }
  - { if: ["war.battle == hundred_days_october", "war.phase == 3", "start == mill"], go: b_oct_3 }
  # the war's questions
  - { if: "war.pending == tunnel", go: w_tunnel }
  - { if: "war.pending == tour", go: w_tour }
  - { if: "war.pending == duty", go: w_duty }
  - { if: "war.pending == mission", go: w_mission }
  - { if: "war.pending == sick", go: w_sick }
  - { if: "war.pending == course", go: w_course }
  - { if: "war.pending == battle", go: w_battle }
  - { if: "war.pending == leave", go: w_leave }
default: e_error
