# ==== The girl in France: Marthe Delattre at Ternecourt (the same text in each town's pool) ====

# -- 1916, spring: the estaminet ---------------------------------------------------------------
- id: ro_fr_16_mill
  chapter: front
  kind: pool
  pool: front_1916_mill
  once: true
  weight: 30
  requires: &ro_fr1_req [ "war.tour >= 10", "war.tour <= 12", { not: war.transferred } ]
  on_enter: [ { set: flag.ro_fr_met } ]
  title: Ternecourt
  text: &ro_fr1_text |
    The battalion comes down south in the thaw and goes into billets at Ternecourt, a long street
    of brick and whitewash behind Albert, with a pond at one end and a church whose weathercock has
    been shot crooked. You're in a barn with forty others and a hen who lays in somebody's helmet.

    The estaminet is the front room of the house by the pond. A stove going, oilcloth on the tables,
    a crucifix, a picture of the President cut out of a paper. The mother does the frying in the back
    in a pan the size of a cartwheel, and the smell of hot fat and onions comes through the door and
    down the street and fetches men out of the barns like a dinner bell.

    The daughter carries the plates. She's twenty, perhaps, with her sleeves pushed up and a burn on
    one wrist from the pan, and she has the English the Tommies have taught her, some of it not fit,
    which she doesn't know. "Egg-chip," she says, and puts it down in front of you. "Two egg. The
    beer is no good, the English say. Drink the wine."

    [if flag.ro_sw_first && !flag.ro_sw_ended]There's a letter from home in your breast pocket, half answered.[/if]
  choices: &ro_fr1_choices
    - id: speak
      text: Try your French on her. Merci, mam'selle, and whatever else you've got.
      effects: [ { set: flag.ro_fr_spoke }, { war_mood: { nerve: 1 } } ]
      text_after: |
        You've got about six words and you use them all on the eggs. She laughs, not quite at you,
        and puts you right: oeufs, not erfs, with her lips pushed out, and makes you say it till you
        do. Her name's Marthe. The lads have been calling her Martha for a month and she lets them.
        When you go she says "Bonne nuit," and then, carefully, in English, "Mind the step," and you
        go out and miss it.
      next: "@return"
    - id: eat
      text: Eat up, pay, and get back to the barn.
      text_after: |
        You eat it fast, with the yolk on your chin, and leave your coppers on the oilcloth. Behind
        you the lads are trying their French on her all at once, and she's laughing at them, and the
        stove's roaring, and you go out into the dark street and your blanket.
      next: "@return"

