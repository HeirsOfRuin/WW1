# The city: a man who wrote "Dear Florence" (1916-city.yaml, v16c_holland) hears from Ivy instead.
- id: ro_city_ivy_florence
  chapter: front
  kind: pool
  pool: front_1916_city
  once: true
  weight: 30
  requires: [ "war.tour >= 12", flag.ro_sw_first, flag.c16_florence, { not: flag.ro_sw_ended } ]
  on_enter: [ { set: flag.ro_sw_16 }, { set: flag.ro_sw_florence }, { set: flag.ro_sw_ended } ]
  title: Ivy
  text: |
    A lilac envelope. You'd half forgotten the colour.

    "Your mother tells me there is a young lady at your office who writes to you, a Miss Holland,
    who has your desk. I am glad you have somebody to write to who knows your work. I think perhaps
    that is more use to you out there than a girl who says Number please. I am not cross. I was, on
    the Sunday, but the choir had the Nunc Dimittis and you cannot stay cross through that. I shan't
    write again unless you want me to. Ivy."

    The violet cachous again, faint, on the paper. You fold it along its creases and it goes in your
    pocket with Florence's, and the two of them sit there against your chest all through stand-to.
  choices:
    - id: honest
      text: Write and tell her the truth about Florence. She's owed that.
      effects: [ { set: flag.ro_sw_blessed }, { war_mood: { nerve: 1 } } ]
      text_after: |
        It takes the evening. You tell her that it's true, and that you didn't mean it to be, and
        that she's worth more than a letter like this one. She writes back a postcard of the Hollow
        Ponds, with the boats, and on the back: Mind you don't catch a crab. Ivy.
      next: "@return"
    - id: leave
      text: Let it be. Don't answer.
      text_after: |
        You don't answer. It sits in your pocket a week and then goes in the brazier, and the lilac
        curls up and goes black, and the smell of violets for a second over the coke.
      next: "@return"

# ==== 1917: her letter (one text, the same in every pool a man can be in) ========================
# Three roads: married at the 1916 leave (the baby is due in the autumn); waiting till it's over
# (she would say yes now); postcards and no promise (she ends it, kindly). A tank or air man who
# met Marthe gets her card here. ro_sw_17 stops an air man who transfers mid-year seeing it twice.

- id: ro_17_letter_mill
  chapter: front
  kind: pool
  pool: front_1917_mill
  once: true
  weight: 25
  requires: &ro_17_req [ "war.tour >= 23", flag.ro_sw_first, { not: flag.ro_sw_ended }, { not: flag.ro_sw_17 }, "flag.ro_sw_married || flag.ro_sw_after || flag.ro_sw_little" ]
  on_enter: &ro_17_enter
    - { set: flag.ro_sw_17 }
    - { if: "flag.ro_sw_little && !flag.ro_sw_married && !flag.ro_sw_after", then: [ { set: flag.ro_sw_jilted }, { set: flag.ro_sw_ended } ] }
  title: A letter from home
  text: &ro_17_text |
    [if flag.ro_sw_married]A letter from your wife. You still have to say it to yourself, your wife, and the word sits oddly, like a new cap. [if start == mill]Nellie[/if][if start == pit]Lizzie[/if][if start == farm]Rose[/if][if start == city]Ivy[/if] writes on Sundays, the way she always did, but she signs it different now, and puts a line under it.[/if][if flag.ro_sw_after && !flag.ro_sw_married][if start == mill]Nellie's[/if][if start == pit]Lizzie's[/if][if start == farm]Rose's[/if][if start == city]Ivy's[/if] letter has a ring drawn at the bottom of it in pencil, round and round, till the paper's nearly through.[/if][if flag.ro_sw_little && !flag.ro_sw_married && !flag.ro_sw_after][if start == mill]Nellie's[/if][if start == pit]Lizzie's[/if][if start == farm]Rose's[/if][if start == city]Ivy's[/if] letter is written straight across the page, as if she ruled the lines first, and you know before you've read a word of it.[/if]

    [if flag.ro_sw_married && war.month <= 8]"I have been to the doctor and he says the autumn. Your mother is knitting as if it was piecework.[/if][if flag.ro_sw_married && war.month >= 9]"She came on a Tuesday, a girl, seven pounds, with your mother's chin and a voice on her you could hear in the next street. Your mother is knitting as if it was piecework.[/if][if flag.ro_sw_married && start == mill] I am still at the looms but the overlooker has put me by the door, for the air.[/if][if flag.ro_sw_married && start == pit] I have left the trams and come home to your mother's. She would not hear of anything else.[/if][if flag.ro_sw_married && start == farm] Father says I am not to go up the hoist and I go up when he is at market.[/if][if flag.ro_sw_married && start == city] I have given in my notice at the exchange. They don't keep married girls in my way, and the supervisor gave me a cruet, the same as the others.[/if][if flag.ro_sw_married] The separation allowance comes on a Monday at the post office, and your allotment with it, and I put by what I can. I keep thinking of you not knowing what is happening to me, and me not knowing what is happening to you, and the letters going backwards and forwards in between, crossing."[/if]

    [if flag.ro_sw_after && !flag.ro_sw_married]"I have not changed my mind and I shan't. But they are being married every leave now, by licence, and I stand at the back of church and cry like a fool at every one of them, and I am tired of being the one at the back. If you asked me again I would say the other thing this time. I am only saying."[/if]

    [if flag.ro_sw_little && !flag.ro_sw_married && !flag.ro_sw_after]"I waited to hear from you properly, and I have had cards. I don't blame you. I expect you can't, out there, and it's not for me to know why. But I have to tell you I have been walking out with[if start == mill] Jack Kenyon from the dye works, who came home from Gallipoli with his arm stiff and wears the silver badge so nobody gives him a feather[/if][if start == pit] Ned Forster, the deputy's lad, that the pit would not let go for a soldier[/if][if start == farm] Harry Moule, the carrier's son, that the doctors turned down for his chest[/if][if start == city] a Mr Pratt, a telephone engineer at the exchange, who was turned down three times for his eyes and tried a fourth[/if], and he has asked me, and I have said yes. He is kind, and he is here. I hope you won't think too hard of me. I shall pray for you every night. I always have."[/if]

    [if flag.ro_fr_spoke && war.transferred]In with it, sent on by somebody in the battalion, there's a picture postcard of the church at Ternecourt, with its crooked weathercock. On the back, in pencil, in careful English: For the soldier who said erfs. We are all well. Lucien is home on permission and eats everything. Marthe. You read it twice, and put it in your pay book, and feel like a thief.[/if]
  choices: &ro_17_choices
    - id: wife_truth
      text: Write back the truth. You're frightened, for her and for you.
      visible_if: flag.ro_sw_married
      effects: [ { war_mood: { nerve: 1 } } ]
      text_after: |
        You write it in a green envelope, so it goes past the officer, and you tell her: that you're
        frightened, and that you'd not say it to anyone else living. Her answer is two lines. So am
        I. Come home. You keep it in your pay book, where the last letter used to be.
      next: "@return"
    - id: wife_names
      text: Write about the baby, and nothing else. Pages of it.
      visible_if: flag.ro_sw_married
      effects: [ { set: flag.ro_sw_named }, { war_mood: { nerve: 2 } } ]
      text_after: |
        Four sides. Names, and which you like, and why. What you'll do with a girl, and with a boy,
        and the cradle your father can make out of the old chest. You don't mention the war at all,
        and for a whole evening there isn't one.
      next: "@return"
    - id: ask_again
      text: Ask her again, properly. Christmas leave, by licence.
      visible_if: "flag.ro_sw_after && !flag.ro_sw_married"
      effects: [ { set: flag.ro_sw_wed17 }, { war_mood: { nerve: 2 } } ]
      text_after: |
        You write it in a green envelope, and you don't tear any up this time. Her answer comes in a
        week: Yes, and about time, and she's put her name down for the licence, and you're to get your
        hair cut.
      next: "@return"
    - id: hold_on
      text: Ask her to hold on till it's over. You meant after.
      visible_if: "flag.ro_sw_after && !flag.ro_sw_married"
      effects: [ { set: flag.ro_sw_wait2 } ]
      text_after: |
        You tell her you meant after, and you still do, and that you'd not have her stood at the back
        of church in black. She writes that she'll hold on, then. The ring at the bottom of the next
        letter is drawn smaller.
      next: "@return"
    - id: bless
      text: Write back and wish her happy. Mean it.
      visible_if: "flag.ro_sw_little && !flag.ro_sw_married && !flag.ro_sw_after"
      effects: [ { set: flag.ro_sw_blessed }, { war_mood: { nerve: 1 } } ]
      text_after: |
        It's the best letter you've written her, and the last. You tell her he sounds a decent man,
        and that she's to be happy, and that the cards were your fault and nobody else's. You don't
        put a field postcard in with it.
      next: "@return"
    - id: burn
      text: Don't answer. There's nothing to say.
      visible_if: "flag.ro_sw_little && !flag.ro_sw_married && !flag.ro_sw_after"
      effects: [ { war_mood: { nerve: -1 } } ]
      text_after: |
        You read it once more, and fold it, and put it in the brazier at stand-down. The paper goes
        brown at the edges first, and then all at once.
      next: "@return"
    - id: later
      text: Put it in your pay book. Not tonight.
      text_after: |
        You fold it along its creases and put it in your pay book with the others. You read it again
        at stand-to, and again in the dark with your thumb over the words you know, and you don't
        write anything back. Not tonight.
      next: "@return"

