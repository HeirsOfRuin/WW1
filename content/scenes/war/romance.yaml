# -- 1917, January: the battalion marches north ------------------------------------------------------
- id: ro_fr_17_mill
  chapter: front
  kind: pool
  pool: front_1917_mill
  once: true
  weight: 25
  requires: &ro_fr3_req [ "war.tour <= 21", flag.ro_fr_spoke, { not: war.transferred } ]
  title: Moving north
  text: &ro_fr3_text |
    The battalion has come back to Ternecourt for the worst of the winter, and now there are orders:
    north on Thursday. Nobody says where; everybody says Arras. It's snowing, the soft wet kind,
    and the estaminet windows are steamed so thick you can't see in, only the shapes of men and the
    red of the stove.

    Marthe has your plate ready before you've sat down. When she comes back for it she has a bit of
    paper folded small, and puts it under the salt. Delattre, Estaminet du Bon Coin, Ternecourt,
    Somme, in a hand like a schoolmistress's.

    [if flag.ro_fr_walked]Five Sundays you walked by the stream. Once, in the rain, under the willows, she took your arm, and then let go of it when her mother came to the door.[/if][if flag.ro_fr_friend]You lifted the beet, and the potatoes after, and the old man gave you the clear stuff every time, and called you something in French the lads say means son-in-law, and laughed.[/if][if flag.ro_sw_married] She knows about your wife. She asked to see the photograph, and held it near the lamp, and gave it back and said she was pretty, which she is.[/if]

    "You write," she says. It isn't quite a question.
  choices: &ro_fr3_choices
    - id: promise
      text: Take the address. Promise to write.
      effects: [ { set: flag.ro_fr_writes }, { war_mood: { nerve: 1 } } ]
      text_after: |
        You write the first one on the march, at a halt, on your knee, in English, with three words of
        French at the end from the phrase book in the YMCA hut. The officer who censors it raises an
        eyebrow at the French and passes it. Her answer finds you in a fortnight: two sides in French
        you can read about half of, and one line in English. The eggs are not so good with no you.
      next: "@return"
    - id: part
      text: Say goodbye properly, and leave it there.
      effects: [ { set: flag.ro_fr_parted } ]
      text_after: |
        You shake her hand, and her father's, and her mother's, who kisses you on both cheeks and
        smells of onions and lavender. Marthe stands in the door with the light behind her while the
        company forms up in the snow. You don't look back till the bend in the road, and when you do
        the door's shut.
      next: "@return"

