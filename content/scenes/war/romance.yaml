# -- 1916, autumn: the farm, and her brother at Verdun --------------------------------------------
- id: ro_fr_16b_mill
  chapter: front
  kind: pool
  pool: front_1916_mill
  once: true
  weight: 30
  requires: &ro_fr2_req [ "war.tour >= 15", flag.ro_fr_spoke, { not: war.transferred } ]
  title: Marthe
  text: &ro_fr2_text |
    Out at rest at Ternecourt again, what's left of the battalion, after the summer. The street's
    the same. The weathercock's the same. The barn has new straw, and nobody says who slept where
    last time.

    Marthe knows you. She puts the plate down and stands there with the cloth over her arm and says,
    "You. Erfs," and you both laugh, and it's the first time you have since July.

    She has a letter from her brother, Lucien. He's at Verdun. It's six weeks old and the French
    censor has been at it with scissors, so it's more holes than letter, and she reads you what's
    left in French, slowly, and you understand one word in four. Il tient. He holds. She says it
    twice, so you'll know it.

    Her father is too old for the army and the farm behind the house wants the beet lifting before
    the frost, and there's nobody to lift it. On Sunday, she says, if the English have nothing for you
    to do. She doesn't look at you when she says it.

    [if flag.ro_sw_wed16]In your pocket is the letter that says yes. You're to be married at Christmas. You haven't said.[/if][if flag.ro_sw_after]In your pocket is the letter about the ring. You haven't said.[/if]
  choices: &ro_fr2_choices
    - id: walk
      text: Go on Sunday. Lift the beet, and walk back with her by the stream.
      effects: [ { set: flag.ro_fr_walked }, { war_mood: { nerve: 2 } } ]
      text_after: |
        Beet all morning, in clay that holds on to your boots like a hand, the old man working beside
        you without a word. After, she walks you back along the stream at the bottom of the village,
        and shows you where Lucien used to catch eels, and talks, in French, and you don't follow
        half of it and it doesn't matter. She doesn't take your arm. At the barn she says, in
        English, "Next Sunday," the way you'd say the day the post goes.
      next: "@return"
    - id: field
      text: Lift the beet with her father, and leave it at that.
      effects: [ { set: flag.ro_fr_friend }, { war_mood: { nerve: 1 } } ]
      text_after: |
        Beet all day with the old man, who says nothing at all, and at the end of it gives you a
        glass of something clear out of an unlabelled bottle that takes the skin off your throat. He
        shakes your hand. Marthe gives you a dozen eggs in your cap to take back to the barn, and
        thanks you, and it's enough.
      next: "@return"

