          - { if: ["war.stage == 3", "war.corps == air"], go: { pool: front_1917_air, count: 1, then: w_tour_on } }
          - { if: ["war.stage == 4", "war.corps == air"], go: { pool: front_1918_air, count: 1, then: w_tour_on } }
          - { if: ["war.stage == 1", "start == pit"], go: { pool: front_1915_pit, count: 1, then: w_tour_on } }
          - { if: ["war.stage == 2", "start == pit"], go: { pool: front_1916_pit, count: 1, then: w_tour_on } }
          - { if: ["war.stage == 3", "start == farm"], go: { pool: front_1917_farm, count: 1, then: w_tour_on } }
          - { if: ["war.stage == 3", "start == city"], go: { pool: front_1917_city, count: 1, then: w_tour_on } }
          - { if: ["war.stage == 3", "start == pit"], go: { pool: front_1917_pit, count: 1, then: w_tour_on } }
          - { if: ["war.stage == 4", "start == farm"], go: { pool: front_1918_farm, count: 1, then: w_tour_on } }
          - { if: ["war.stage == 4", "start == city"], go: { pool: front_1918_city, count: 1, then: w_tour_on } }
          - { if: ["war.stage == 4", "start == pit"], go: { pool: front_1918_pit, count: 1, then: w_tour_on } }
          - { if: ["war.stage == 1", "start == farm"], go: { pool: front_1915_farm, count: 1, then: w_tour_on } }
