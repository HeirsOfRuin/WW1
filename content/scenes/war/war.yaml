# Phase 1 placeholder content: character creation, one scene per question the war asks, and
# the endings. Plain words, period-true; the voice is settled at calibration (DESIGN §13).
# Every decision scene's choices run one `war:` effect and then go to "@war": the content loader
# replaces that with the one route in content/route.yaml (the scene for the war's next question,
# an authored scene that takes it over, or the ending).

- id: c_enlist_mill
  chapter: enlist
  checkpoint: true
  title: The drill hall
  text: |
    The queue starts at the drill hall door and goes back past the Co-op and round into Bury Road.
    Somebody has chalked GOD SAVE THE KING on the wall, and under it somebody else has put AND OUR
    ALBERT, and Albert Shaw is stood right in front of it pretending he can't read.

    It's warm for September. The street smells of the mill on a hundred men at once: machine oil,
    cotton fluff in their hair, the sour sweat of the weaving shed. Without the looms going your
    ears feel hollow, the way they do on a Sunday.

    The recruiting sergeant doesn't shout. He's like a good tackler: he doesn't need to.

    "Age?"

    "Just turned {age_words}, sir."

    Behind you Walter Pilling is going to say nineteen. Walter Pilling was born the same winter as
    your sister, and everybody in the queue knows it, and nobody says a word.
    [break]
    What you take with you from the shed is what you'll have out there.
  choices:
    - id: pick_0
      text: The knack you have with a loom, and legs for a ten-hour day.
      effects: [ { war_home: [mech, stamina] } ]
      next: c_general
    - id: pick_1
      text: The knack you have with a loom, and the voice that leads the chapel choir.
      effects: [ { war_home: [mech, voice] } ]
      next: c_general
    - id: pick_2
      text: Legs for a ten-hour day, and the voice that leads the chapel choir.
      effects: [ { war_home: [stamina, voice] } ]
      next: c_general

- id: c_enlist_pit
  chapter: enlist
  checkpoint: true
  title: The Miners' Hall
  text: |
    The queue comes out of the Miners' Hall door and goes down past the Store and the Primitive
    Methodist chapel nearly to the pit gates, and behind it the winding wheel's still turning,
    because the fore shift isn't up yet. When they do come up they come straight over, black to the
    eyes, bait tins under their arms, and join the end of it, and nobody tells them to go home and
    wash first.

    The colliery band played the first lot to the station in August. They're not playing today.
    They're in the queue.

    The street smells of the pit on a hundred men: coal dust and wet pit clothes and sweat, and
    over it all the sulphur off the heap that's been burning since before you were born. There's a
    blue mark on every forehead and every set of knuckles, where the coal got into a cut and healed
    in.

    The manager came down this morning in his good coat and said coal was war work too. Jim Bell
    asked him if coal would pay the widows, and the manager went red and went home.

    "Age?"

    "Just gone {age_words}, sir."

    Tommy Robson's in front of you, your marra at the face these two years, saying nothing, which
    is how Tommy says most things. George Charlton's behind you, still smelling of the stables,
    because he went down the pit last night to tell his pony he was going.
    [break]
    What you bring from underground is what you'll have out there.
  choices:
    - id: pick_0
      text: Digging and timbering, and a back for a long shift.
      effects: [ { war_home: [dig, stamina] } ]
      next: c_general
    - id: pick_1
      text: Digging and timbering, and a hand with the engines and the pumps.
      effects: [ { war_home: [dig, mech] } ]
      next: c_general
    - id: pick_2
      text: A back for a long shift, and a hand with the engines and the pumps.
      effects: [ { war_home: [stamina, mech] } ]
      next: c_general

- id: c_enlist_city
  chapter: enlist
  checkpoint: true
  title: Guildhall
  text: |
    The queue goes out of the Guildhall yard and down Gresham Street and round into Basinghall
    Street, four deep, and every man in it is wearing a bowler hat. Clerks. From the insurance
    offices and the banks and the shipping firms, from every desk in the City, come out at dinner
    time with their sandwiches in their pockets and stood in the queue instead.

    It's warm for September. The street smells of horse dung and hot stone and the river, and of
    the City on a hundred men: ink, brilliantine, the starch in a hundred stiff collars. A man in
    front of you is still holding a ledger.

    The manager came round the office at eleven and shook every man's hand and said the Gresham
    and Lombard would make up their salaries for as long as it lasted. Arthur Webb, from the next
    desk, wrote it down. Percy Fenton was out of the door before the manager finished. Leonard Marsh
    sat up half the night with a card from the optician's, learning the letters.

    The sergeant writes your name. "Age?"

    "Just turned {age_words}, sir."
    [break]
    What you bring from the office is what you'll have out there.
  choices:
    - id: pick_0
      text: A clerk's head for reading and figures, and a bowler's arm from Saturday cricket.
      effects: [ { war_home: [lit, sport] } ]
      next: c_general
    - id: pick_1
      text: A clerk's head for reading and figures, and the St John Ambulance certificate.
      effects: [ { war_home: [lit, firstaid] } ]
      next: c_general
    - id: pick_2
      text: A bowler's arm from Saturday cricket, and the St John Ambulance certificate.
      effects: [ { war_home: [sport, firstaid] } ]
      next: c_general

- id: c_enlist_farm
  chapter: enlist
  checkpoint: true
  title: Harvest home
  text: |
    The harvest's in, and the harvest supper's in the big barn at Court Farm, the way it is every
    year: trestle tables, a ham, cider from the squire's own press, the fiddler from Brendon, and
    the barn still smelling of the corn it held all summer. Only this year the squire stands up at
    the end with a paper in his hand, and there's a recruiting sergeant beside him in a red sash,
    and nobody's dancing.

    The squire's son, young Mr Venn, is taking a commission. He'll have a platoon, the squire says,
    and he'd like it to be Dunsworthy men.

    Will Cottle puts his tankard down and stands up first, because his father's looking at him and
    he can't bear it. Dan Pearce stands up because Will has, and because it's further from the
    keeper. Bert Yeo, who rang the bells for the harvest thanksgiving that morning, stands up
    because everybody else is.

    The sergeant writes your name. "Age?"

    "Just gone {age_words}, sir."
    [break]
    What you bring from the land is what you'll have out there.
  choices:
    - id: pick_0
      text: A shotgun and a poacher's eye, and the legs to walk the moor all day.
      effects: [ { war_home: [field, stamina] } ]
      next: c_general
    - id: pick_1
      text: A shotgun and a poacher's eye, and a hand with the threshing engine.
      effects: [ { war_home: [field, mech] } ]
      next: c_general
    - id: pick_2
      text: The legs to walk the moor all day, and a hand with the threshing engine.
      effects: [ { war_home: [stamina, mech] } ]
      next: c_general

- id: c_general
  chapter: enlist
  title: The last night
  text: |
    Your mother has sewn your name into everything you own. The kitchen smells of hot iron and the
    starch she's put in your collars, which the army will take off you in a week. She's not
    talking much. She keeps finding things to fold.

    There's one more thing you've got that the army didn't give you.
  choices:
    - id: firstaid
      text: First aid. The ambulance class at the works, certificate in a frame.
      effects: [ { war_general: firstaid } ]
      next: c_training
    - id: sport
      text: A throwing arm. Second eleven, and you can hit a stump from the boundary.
      effects: [ { war_general: sport } ]
      next: c_training
    - id: voice
      text: A voice. When you start a hymn, men join in.
      effects: [ { war_general: voice } ]
      next: c_training

- id: c_training
  chapter: enlist
  title: Training
  text: |
    Eight months of it. Huts with floors that never dry. Drill in your own clothes till Christmas,
    then in blue serge, then at last in khaki that smells of the store and makes your neck raw.
    Route marches in the rain until your feet are one blister and then they harden and you stop
    noticing. Digging practice trenches in a field and filling them in again. Bayonet drill on
    sacks of straw, the corporal yelling at you to scream, and you feel daft screaming, and then
    one day you don't.

    You learn to sleep anywhere. You learn to eat anything. You learn the men from home all over
    again, the way you never knew them [if start == mill]in the shed[/if][if start == pit]at the face[/if][if start == city]across the office[/if][if start == farm]in the fields[/if]: who snores, who cries, who shares.

    In May the orders come. France.

    {section_line}
  choices:
    - id: embark
      text: Go aboard.
      effects: [ { war_run: true } ]
      next: "@war"

- id: w_tour
  chapter: front
  title: In the line
  text: |
    [if war.month == 1 && war.take == 0]January. The ground's iron and the bully beef comes up frozen in the tin. You rub whale oil into your feet every morning, under the eye of a corporal, because trench foot is a crime now, and the oil stinks of fish and the cold gets in anyway.[/if][if war.month == 1 && war.take == 1]January. Frost on the wire in the morning, every barb furred white. The braziers fill the dugouts with coke fumes that give you a headache like a hammer, and you sit in them anyway, because outside your breath freezes on your scarf.[/if][if war.month == 2 && war.take == 0]February, and the thaw. The trench walls go soft and slide in, a bay at a time, and you dig them out and they slide in again. The rats are fat from the winter. One runs over your face in the night and you've stopped waking up for it.[/if][if war.month == 2 && war.take == 1]February. Wet, and then wetter. The duckboards float. Everything you own is damp, your blanket, your socks, your bread, and the whole line smells of wet wool and wet earth and the latrine.[/if][if war.month == 3 && war.take == 0]March. Rain on the wind, and the wind straight off the German line, so it smells of them: their cooking, their tobacco, their latrines. The pumps go all night and the water comes back in all day.[/if][if war.month == 3 && war.take == 1]March. A raw grey month. The sky sits on the trench like a lid. You don't feel your feet from one end of the tour to the other.[/if][if war.month == 4 && war.take == 0]April. Green coming through the churned ground in no man's land, thin and bright, as if nobody had told the grass. At night the frogs croak in the shell holes, a whole chapel choir of them.[/if][if war.month == 4 && war.take == 1]April. Showers and sun, both in an hour. Behind the lines there's blossom on the orchard trees by the billets, and you stand under it with your mess tin and can't take it in.[/if][if war.month == 5 && war.take == 0]May. Warm enough to take your tunic off in the support line. The flies are starting, and the smell from no man's land is starting with them.[/if][if war.month == 5 && war.take == 1]May. The hawthorn's out along the roads behind the lines, white as washing, and the smell of it comes up the communication trench at dusk, sweet, and then the other smell, underneath.[/if][if war.month == 6 && war.take == 0]June. The nights are so short that stand-to is at three in the morning, and the sky's going grey before you've got your boots dry. The water comes up in petrol tins and tastes of petrol and chloride.[/if][if war.month == 6 && war.take == 1]June. Dust, and flies, and the long light evenings. You can read a letter on the firestep at ten at night, and you do, over and over.[/if][if war.month == 7 && war.take == 0]July. Heat. The flies are on everything: the jam, the bread, your mouth if you leave it open. Thirst all day. The sandbags are hot to the touch at noon.[/if][if war.month == 7 && war.take == 1]July. The trench bakes. Men sleep in the afternoon in whatever shade the parapet gives, faces covered with their caps against the flies.[/if][if war.month == 8 && war.take == 0]August. Thunderstorms in the night that you mistake for guns, and guns you mistake for thunder. Behind the lines the French women are getting the harvest in by hand, and they don't look up at the columns going past.[/if][if war.month == 8 && war.take == 1]August. Wasps at the jam tins and the heavy smell of hay from the fields behind the lines, and a storm every few nights that fills the trench to your knees.[/if][if war.month == 9 && war.take == 0]September. Mist in the mornings, low on the ground, so that at stand-to the German line isn't there and then is. Blackberries in the hedges behind the billets; you eat them till your fingers are purple.[/if][if war.month == 9 && war.take == 1]September. The nights drawing in. The air smells of turned earth and the first fires of the year in the farmhouses behind the lines.[/if][if war.month == 10 && war.take == 0]October. Rain, and the mud comes back like an old enemy. Greatcoats again. The leaves are coming down off the last trees in the wood behind the support line, what's left of the trees.[/if][if war.month == 10 && war.take == 1]October. A wet, rotten month. Your puttees never dry. The rum ration starts again and you've never been so glad of anything.[/if][if war.month == 11 && war.take == 0]November. Fog. Dark by half past four. You stand on the firestep in a world the width of your own arm, and every sound in it is close.[/if][if war.month == 11 && war.take == 1]November. Cold rain that turns to sleet at night. The rum comes round at stand-to in the morning and you hold it in your mouth as long as you can, for the warmth.[/if][if war.month == 12 && war.take == 0]December. Frost again, and the parcels start coming up from home: plum puddings in tins, mufflers, socks, a cake from the Co-op in greaseproof paper. The post corporal is the most popular man in the battalion.[/if][if war.month == 12 && war.take == 1]December. The short days. You're in the dark at both ends of every working party. Somebody in the next bay is singing a carol under his breath, badly, and nobody stops him.[/if][if war.back_from_leave] The railhead smells of horse dung and wet canvas and coal smoke. Home is a day and a half behind you and already it doesn't seem real.[/if][if war.back_from_wound && !war.transferred] You're back with the battalion, the wound pulling every time you lift your arm, and the lads look at you as if you'd been somewhere they'd rather be.[/if][if war.back_from_wound && war.transferred] You're back with the company, the wound pulling every time you lift your arm, and the crew make you a brew without being asked.[/if][if war.lost_last == 1 && !war.transferred] {lost_last_name}'s place on the firestep has somebody from the draft in it, a lad who doesn't know where to put his feet.[/if][if war.lost_last >= 2 && !war.transferred] There are gaps in the section now. You keep looking for faces that aren't there.[/if][if war.lost_last >= 1 && war.transferred && war.take == 0] Word comes over from the battalion of men from home gone since. You hear it, and go down the shaft.[/if][if war.lost_last >= 1 && war.transferred && war.take == 1] A battalion man at the water point tells you who's gone from home since. You don't ask him to say it twice.[/if][if war.promoted_last && war.rank <= 4] The new stripe is sewn on crooked. Men who were your mates last week say '[if war.rank <= 2]Corporal[/if][if war.rank >= 3]Sarge[/if]' in a voice that isn't quite their own.[/if][if war.promoted_last && war.rank >= 6] Another pip on your cuff, sewn on by your servant by candlelight.[if war.rank == 7] You have the company now, what's left of it, and a captain's worries with a lieutenant's pay until the paper comes through.[/if][/if][if war.award_last] The {award_last_name} is in battalion orders. Nobody says a word about it to your face, and everybody talks about it behind your back.[/if][if war.detailed_last == wiring] Last tour the sergeant put you on a wiring party.[/if][if war.detailed_last == patrol] Last tour you were sent out on a patrol.[/if][if war.detailed_last == raid] Last tour they put you on a raid, whether you liked it or not.[/if][if war.detailed_last == listening] Last tour you did a stint in a listening post.[/if][if war.detailed_last == carrying] Last tour you were on a carrying party, two miles of trench each way.[/if][if war.detailed_last == bomb || war.detailed_last == lewis || war.detailed_last == snipe || war.detailed_last == signals || war.detailed_last == tunnel] Last tour they sent you out on your own work, though you'd said you weren't fit.[/if][if war.detailed_last != none && war.detailed_ok] It went all right.[/if][if war.detailed_last != none && !war.detailed_ok] It went wrong, the way these things do.[/if]
  choices:
    - id: on
      text: "[if war.take == 0]Go on.[/if][if war.take == 1]Another tour.[/if]"
      effects: [ { war: "on" } ]
      next: "@war"

- id: w_duty
  chapter: front
  title: A front-line tour
  text: |
    The sergeant wants men for {duty_name} tonight. {friend_line}

    [if war.duty == raid]A raid: blackened faces, cap badges off, no pay books, coshes and bombs, and a run across in the dark to drag a prisoner back. The ones who come back from raids don't sleep for a day after.[/if][if war.duty == patrol]A patrol means lying in no man's land for hours, cold right through, listening to them talk in their trench and trying not to breathe.[/if][if war.duty == wiring]Wiring means out in front with mallets wrapped in sacking and coils of wire that bite through your gloves, freezing every time a flare goes up.[/if][if war.duty == listening]A listening post is a hole in the ground out past the wire, two men and a string back to the trench, and every sound in the dark is somebody coming.[/if][if war.duty == carrying]A carrying party: up the communication trench and back with ammunition boxes and duckboards and coils of wire, all night, in the wet, shelled by guns that know the route as well as you do.[/if]
  choices:
    - id: volunteer
      text: "Volunteer. ({duty_risk}, {duty_cost})"
      effects: [ { war: volunteer } ]
      next: "@war"
    - id: stay_back
      text: Keep your head down and let him choose.
      effects: [ { war: stay_back } ]
      next: "@war"

- id: w_mission
  chapter: front
  title: Your own work
  text: |
    [if war.path == lewis && war.take == 0]A raid is going over at two in the morning and the gun's to cover it. You set up in a sap head out past the wire with your No. 2 and four drums. The barrel shroud is so cold it burns your fingers through the mittens. When the raiders go, you fire short bursts over their heads at the German parapet, and every burst lights you up like a lamp in a window, and every German on that stretch can see exactly where you are.[/if][if war.path == lewis && war.take == 1]A German two-seater comes over low in the evening, slow and fat and close enough to see the observer's goggles. The officer wants the gun up on its post for it. You'll be standing in the open with the gun pointing at the sky and your back to their line, firing up at it while it fires down at you.[/if][if war.path == signals && war.take == 0]The line to battalion's gone again. Somewhere in the half mile of communication trench behind you a shell has cut it, and the colonel wants the company commander and can't have him. You take the pliers, a reel of D3 cable and the buzzer, and go along it in the dark, running the wire through your fingers, feeling for the break.[/if][if war.path == signals && war.take == 1]A message has to go to battalion, and the wires are all down, and the lamp can't be seen through the smoke. Somebody has to run it. Four hundred yards of open ground they've been shelling since dawn, with the message in your breast pocket in case they find you.[/if][if war.path == bomb]A bombing raid tonight: eight of you, faces blacked with burnt cork, no cap badges, no pay books, a sandbag each of Mills bombs. Into their trench, along it a bay at a time, a prisoner if you can get one, and back before their machine guns wake up.[/if][if war.path == snipe]Before dawn you crawl into the hide in the parapet, a steel plate with a slit, a sack over the slit, your observer beside you with the telescope and the notebook. You stay till dark. They have snipers looking for this plate. Some mornings you see a man over there shaving in a bit of mirror, his braces down, and he puts you in mind of your father at the scullery sink.[/if][if war.path == tunnel]Down the shaft, along the gallery on your back on the trolley, to the face. Candle, the smell of wet clay and your own sweat. You lie with the listening stick against the clay and listen for them. If you can hear them digging, they're far enough off. If they stop, they're listening for you. If it goes quiet for a day, they've laid a charge.[/if]

    The work's yours now. You can say you're not fit for it. You'll usually be sent anyway.
  choices:
    - id: go
      text: "[if war.path == lewis]Take the gun up.[/if][if war.path == signals]Go.[/if][if war.path == bomb]Black your face and go.[/if][if war.path == snipe]Go out to the hide.[/if][if war.path == tunnel]Go down.[/if] ({mission_risk})"
      effects: [ { war: go } ]
      next: "@war"
    - id: decline
      text: Say you're not fit for it tonight.
      effects: [ { war: decline } ]
      next: "@war"

- id: w_sick
  chapter: front
  title: Rest
  text: |
    [if war.take == 0]Out at rest, in a barn behind the lines. Somebody's got a mouth organ going and somebody else is
    frying bread in a mess tin, and the smell of it should make you hungry. You hold your mug of
    tea in both hands so the others won't see it shake. It shakes anyway. The tea goes cold and you
    don't drink it.[else]Out at rest. You've slept twelve hours and you're more tired than when you lay down. Every time a door
    bangs in the farmyard you're flat on the straw before you know you've moved, and the others
    pretend they haven't noticed, which is kind of them, and you hate it.[/if]

    The medical officer holds a sick parade every morning at seven. He's a busy man, and a tired
    one, and he's seen everything.
  choices:
    - id: report
      text: Report sick. The medical officer may give you a tour out of the line.
      effects: [ { war: report } ]
      next: "@war"
    - id: carry_on
      text: Say nothing and carry on.
      effects: [ { war: carry_on } ]
      next: "@war"

- id: w_course
  chapter: front
  title: A course
  text: |
    The company sergeant major stops you at the water cart. There's a place going on a course,
    two weeks behind the lines, and he's put your name down unless you'd rather he didn't.

    [if war.course == lewis]The Lewis gun: twenty-eight pounds of it, a drum of forty-seven rounds on top like a gramophone record, and a temper. When it jams it jams in the worst place. The gun team are out of the attacks till they're needed and then they're needed more than anybody, and every German gunner looks for them first.[/if][if war.course == signals]Signals: flags, lamps, the buzzer, the field telephone and its miles of wire. When the wire's cut, and it's always cut, the signaller runs the message himself, across whatever's between him and battalion.[/if][if war.course == bomb]Bombing: the Mills bomb, pin and lever, four seconds. The bombers go first along an enemy trench, a bay at a time, and the men who come back from a bombing course don't joke about it.[/if][if war.course == snipe]Sniping: a rifle with a telescopic sight, a hide in the parapet, a partner with a periscope and a notebook. Hours of nothing. Then a second.[/if][if war.course == lead]An NCO course: map reading, fire orders, how to keep a section together when the corporal's gone. They want men who can take charge.[/if]
    [if start == mill && war.course == lewis && war.mate2] Duckworth says his dad could strip one blindfold. "It's only a loom that shoots," he says.[/if]
  choices:
    - id: take
      text: Take it. Two weeks out of the line, and a trade after.
      effects: [ { war: take } ]
      next: "@war"
    - id: decline
      text: Stay with the section.
      effects: [ { war: decline } ]
      next: "@war"

- id: w_tunnel
  chapter: front
  title: The tunnellers
  text: |
    The Royal Engineers want miners. Six shillings a day against your one, out of the attacks, and
    work you know. The tunnellers do not go over the top. They go under it.
  choices:
    - id: transfer
      text: Go to the tunnellers. You will leave the section.
      effects: [ { war: transfer } ]
      next: "@war"
    - id: stay
      text: Stay with the men from home.
      effects: [ { war: stay } ]
      next: "@war"

- id: w_battle
  chapter: front
  title: "{battle_name}"
  text: |
    {phase_count} {phase_line}
  choices:
    - id: push
      text: "Push on. ({risk_push})"
      effects: [ { war: push } ]
      next: "@war"
    - id: help
      text: "Help the man beside you. ({risk_help})"
      effects: [ { war: help } ]
