- id: w_duty
  chapter: front
  title: A front-line tour
  text: |
    [if war.duty == raid][if war.stage == 1][if war.month <= 9]Summer in the Loos country, among the slag heaps and the pithead towers, in trenches cut white into the chalk. Brigade wants to know who's holding the line opposite before the push that everybody whispers about and nobody's been told of.[else]Autumn in the old Loos line. Since the battle there are craters where the redoubt was, the rain has turned the chalk to a grey paste that gets under your nails, and brigade wants a prisoner to say who's come in opposite.[/if][elif war.stage == 2][if war.month <= 6]The Somme, the downland behind the line still green, larks over it, and the villages still with their roofs on. Before the big attack the staff want a prisoner every week to say what's opposite, and tonight it's the battalion's turn.[elif war.month <= 9]The Somme, after the first of July. Their new line is on the far side of a wood smashed to stumps, and on a warm night you can smell the wood from here, sap and gas and the dead.[else]The Somme in the autumn rain, the chalk gone to a grey glue that sucks at your boots. Their line's a row of flooded shell holes, and the raid's to find out which of them are held.[/if][elif war.stage == 3][if war.month <= 5]Arras[if war.month <= 4], after the hardest winter anybody can remember, with the frost still splitting the chalk of the parapet[else] in May, the chalk trenches east of the town white in the sun, and the dead of April not all buried[/if]. The staff want prisoners from every yard of the line opposite, and they want them now.[elif war.month <= 7]Flanders: flat wet fields round Ypres, ditches running between them, and every bit of rising ground is theirs. Something big is coming, and before it the staff want a man from every regiment opposite.[else]The salient in the autumn, the mud past anything you've known: shell holes lip to lip, full of green water, and their line a string of concrete pillboxes. Getting to one means an hour in that mud before you start.[/if][else][if war.month <= 3]Winter in the salient, in the line the battalion took last autumn: frozen shell holes, duckboard tracks, a German pillbox for company headquarters with its door facing the wrong way. Their raiders have been over twice this month, and the colonel wants one of theirs back.[elif war.month <= 7]Since the retreat the line's new, scraped across farmland, with green corn coming up in no man's land and a farmhouse standing in their wire. Nobody's sure who's opposite now, or quite where.[else]Open country, and the Germans going back: hedges, orchards, villages with people still living in the cellars. Their line's a chain of posts along the hedgerows, and the raid's to take one before they move again.[/if][/if][/if][if war.duty == patrol][if war.stage == 1][if war.month <= 9]Summer in the Loos country. No man's land here is an old beet field gone to thistles, with the slag heaps black against the sky behind their line, and nobody's sure what they've done to their wire this week.[else]Autumn in the old Loos line. The men from the September attack are still lying out in front of their wire, in the long grass, and the patrol goes out among them.[/if][elif war.stage == 2][if war.month <= 6]The Somme, and the downland quiet, larks over no man's land all day and the wind smelling of turned earth. Somebody at brigade wants to know about every yard of their wire.[elif war.month <= 9]The Somme, after the first of July. Nobody's sure where their new line runs through the smashed woods, and the patrol's to go and find it.[else]The Somme in the autumn rain. The patrol's to find whether a line of shell holes out in front is theirs or empty, and in this weather it could be either.[/if][elif war.stage == 3][if war.month <= 5]Arras[if war.month <= 4], and the cold[/if]. No man's land in front of the town is chalk[if war.month <= 4] under old snow[else] scabbed with new grass, white under the flares[/if], and a man crawling on it shows like a fly on a tablecloth.[elif war.month <= 7]Flanders in the summer, flat as a board, the ditches still running and the frogs going in them all night. The patrol's to look at their wire before the big show everybody can feel coming.[else]The salient after the rains. There's no proper no man's land out here, only mud and water and pillboxes, and the patrol's to find which of them are held.[/if][else][if war.month <= 3]Winter in the salient. Out in front the shell holes are frozen over, and the ice cracks under a man's knee like a pistol shot.[elif war.month <= 7]Since the retreat the line's new, through fields and hedges nobody's fought over before. The patrol's to find where their posts are in the young corn.[else]Open country, and they're going back. The patrol's to find out whether the village in front is still held, and the lane into it smells of their horses.[/if][/if][/if][if war.duty == wiring][if war.stage == 1][if war.month <= 9]Summer in the Loos country, the nights short, and the chalk out in front throws back every flare like snow. The new belt has to be in before the push.[else]Autumn in the old Loos line, after the battle. The wire in front went in the bombardment, nearly all of it, and the line's been naked since.[/if][elif war.stage == 2][if war.month <= 6]The Somme, before the push. The wire in front of the battalion has to be thick enough to stop the Germans, with lanes left in it for our own men to go out by in the summer.[elif war.month <= 9]The Somme in the summer. The new line's only days old, a chain of shell holes joined up with a spade, and it has no wire at all.[else]The Somme in the autumn rain. The pickets won't hold in this mud: you screw them in and they lean over like drunks on a Saturday night.[/if][elif war.stage == 3][if war.month <= 5][if war.month <= 4]Arras, in a frost that's gone a foot down into the ground. The pickets have to be screwed into earth as hard as a flagstone.[else]Arras in May, and the chalk's dry and hard. The pickets squeal going in, and the noise carries.[/if][elif war.month <= 7]Flanders, the short summer nights. Under the grass the ground's wet a spade deep, and the pickets go in easy and come out easier.[else]The salient in the autumn. Wire's no use in this mud, everybody says, and you're to put it out anyway, round a pillbox that used to be theirs.[/if][else][if war.month <= 3]Winter in the salient, and word that they'll attack in the spring. Every battalion's wiring every night, belt behind belt.[elif war.month <= 7]Since the retreat the line's new and there's hardly any wire in front of it: a few strands across a field of young corn, and a farm gate.[else]Open country, going forward, and not much wiring to do. Tonight it's a few strands across a road at the edge of a village, in case they come back.[/if][/if][/if][if war.duty == listening][if war.stage == 1][if war.month <= 9]Summer in the Loos country, and the miners on both sides are busy under the chalk. Some nights in the post you can feel their picks through the ground, under your belly.[else]Autumn in the old Loos line, the nights getting longer. The post's in the lip of a crater from the battle, with the chalk raw and white in it and cold as a cellar step.[/if][elif war.stage == 2][if war.month <= 6]The Somme, before the push. Behind you the guns are coming up all night, wheels and harness and horses blowing, and out in the post you can hear the Germans listening to it.[elif war.month <= 9]The Somme in the summer, in a line nobody's had time to make. The post's a shell hole with a groundsheet over it, and the smell from no man's land comes in under the sheet.[else]The Somme in the autumn, and the post half full of water. You lie in it with the cold coming up through your greatcoat.[/if][elif war.stage == 3][if war.month <= 5]Arras[if war.month <= 4], a hard frost. Sound carries on frozen ground[else] in May, a still night. Sound carries over the chalk[/if]: a cough in their trench comes across as clear as a cough in chapel.[elif war.month <= 7]Flanders in the summer, the frogs going in the ditches all night, so loud you have to listen under them.[else]The salient in the autumn. The post's a shell hole with a duckboard laid across the water in it, and every sound out here is the mud sucking at somebody's boots.[/if][else][if war.month <= 3]Winter in the salient, and everybody waiting for their big attack. The colonel wants ears out in front every night, in case it's tonight.[elif war.month <= 7]Since the retreat the line's new, through farmland. The post's in a ditch under a hawthorn hedge, and the hedge drips on you all night.[else]Open country, and the line moving. The post's in a sunken lane outside a village, and you can hear their transport going away on the cobbles, east.[/if][/if][/if][if war.duty == carrying][if war.stage == 1][if war.month <= 9]Summer in the Loos country. The communication trench runs a mile and more through chalk, past the pithead towers, and the white dust of it gets in your teeth.[else]Autumn in the old Loos line, and rain. The trenches are chalk slurry to the knee, and everything the line needs comes up it on men's backs.[/if][elif war.stage == 2][if war.month <= 6]The Somme, before the push. Everything for the big attack goes up on men's backs at night: shells, wire, gas cylinders, water in petrol tins, more than anybody's ever seen.[elif war.month <= 9]The Somme in the summer, across the old front line and on over ground that was theirs, where nobody's had time to dig a trench to carry anything along.[else]The Somme in the autumn. The communication trenches have gone to soup, and the carrying parties go up over the top instead, on duckboards, in the open.[/if][elif war.stage == 3][if war.month <= 5]Arras: the carrying party goes up from the town through the caves and tunnels under it, by electric light, and comes out into the [if war.month <= 4]frost[else]night air[/if] at the far end.[elif war.month <= 7]Flanders in the summer, everything going up for the big show. The roads round Ypres are shelled every night, and the party goes up past dead horses at the corners.[else]The salient in the autumn. There's no trench to carry along: a duckboard track over the mud a plank wide, and a man who steps off it can go in to his waist.[/if][else][if war.month <= 3]Winter in the salient, along duckboard tracks frozen slippery as glass. The party falls, and gets up, and falls.[elif war.month <= 7]Since the retreat, across new country: a line of posts in farmland, and the party goes up through an orchard and along a hedge.[else]Open country, going forward, and the carrying's mile on mile now, along roads that were theirs last week, with their signboards still up.[/if][/if][/if]

    [if war.duty_nco]The platoon sergeant wants men for {duty_name} tonight, and it's your section's turn. You're to find the men, and he doesn't care how. The men from home know the work. The new men from the draft don't, and they know it too.[else]The sergeant wants men for {duty_name} tonight. {friend_line}[/if]

    [if war.duty == raid]A raid: blackened faces, cap badges off, no pay books, coshes and bombs, and a run across in the dark to drag a prisoner back. The ones who come back from raids don't sleep for a day after.[/if][if war.duty == patrol]A patrol means lying in no man's land for hours, cold right through, listening to them talk in their trench and trying not to breathe.[/if][if war.duty == wiring]Wiring means out in front with mallets wrapped in sacking and coils of wire that bite through your gloves, freezing every time a flare goes up.[/if][if war.duty == listening]A listening post is a hole in the ground out past the wire, two men and a string back to the trench, and every sound in the dark is somebody coming.[/if][if war.duty == carrying]A carrying party: up the communication trench and back with ammunition boxes and duckboards and coils of wire, all night, in the wet, shelled by guns that know the route as well as you do.[/if]
  choices:
    - id: volunteer
      text: "[if war.duty_nco]Take it out yourself.[else]Volunteer.[/if] ({duty_risk}, {duty_cost})"
      effects: [ { war: volunteer } ]
      next: "@war"
    - id: send_friend
      text: "Send one of the men from home. He knows the work. (For him: {duty_risk})"
      visible_if: war.duty_nco
      effects: [ { war: send_friend } ]
      next: "@war"
    - id: send_draft
      text: "Send one of the new men from the draft. The section will know you did. (For him: {duty_risk_draft})"
      visible_if: war.duty_nco
      effects: [ { war: send_draft } ]
      next: "@war"
    - id: stay_back
      text: Keep your head down and let him choose.
      visible_if: "!war.duty_nco"
      effects: [ { war: stay_back } ]
      next: "@war"

- id: w_mission
  chapter: front
  title: Your own work
  text: |
    [if war.path == bomb][if war.stage == 1][if war.month <= 9]Summer in the Loos country, among the slag heaps. Bombing's the new trade this year, and the colonel wants his bombers to try the chalk trench opposite.[else]Autumn in the old Loos line. Since the battle the two lines are a bomb's throw apart among the craters where the redoubt was, and the bombers fight over a few yards of wet chalk every night.[/if][elif war.stage == 2][if war.month <= 6]The Somme, before the push. The staff want to know what's in the deep dugouts under the trench opposite, and the bombers are to go and look.[elif war.month <= 9]The Somme in the summer, among the smashed woods, where the two lines run into each other and the bombing never stops, a bay won and a bay lost.[else]The Somme in the autumn rain. The bombs come out of the sandbag wet and gritty, and their trench is a ditch of mud.[/if][elif war.stage == 3][if war.month <= 5]Arras[if war.month <= 4], in the frost[/if]. Their trench is chalk, deep and well made, and the bombers have practised on a copy of it behind the line, dug out from the aeroplane photographs.[elif war.month <= 7]Flanders in the summer, before the big show. Their front line's a string of fortified farms and concrete blockhouses, and the bombers are to try one.[else]The salient in the autumn. Their posts are shell holes and pillboxes in the mud, and the bombers have fifty yards of it to cross before they can throw.[/if][else][if war.month <= 3]Winter in the salient, and the colonel wants a prisoner before their spring attack. The ground's frozen, and it rings under your boots like a yard.[elif war.month <= 7]Since the retreat the line's new, cut shallow through farmland, and their trench opposite runs along the edge of a field of young corn.[elif war.month <= 8]Open country, and the Germans going back. Their trench tonight is an old one of ours from 1916, and the old hands know every turn of it.[else]The old Hindenburg Line, the deepest trench you've ever seen, concrete steps going down into the dugouts and the wire in front like a gentleman's hedge.[/if][/if][/if][if war.path == lewis][if war.stage == 1][if war.month <= 9]Summer in the Loos country. The Lewis gun's new this year, the battalion has only a few, and the Germans have heard about them.[else]Autumn in the old Loos line, on the chalk among the craters, where the two lines are close enough to hear each other cough.[/if][elif war.stage == 2][if war.month <= 6]The Somme, before the push. The gun teams have been told the guns go over with the first wave, and they've practised it on a field of beet behind the line.[elif war.month <= 9]The Somme in the summer, in a line that was theirs a week ago, with the flies everywhere and the smell of lime.[else]The Somme in the autumn. The mud gets into everything, and a Lewis gun hates mud more than anything.[/if][elif war.stage == 3][if war.month <= 5][if war.month <= 4]Arras, a cold spring. The oil thickens in the gun overnight, and you keep the drums inside your greatcoat against your chest.[else]Arras in May, warm at last, and the chalk dust gets into the gun the way the frost did in April.[/if][elif war.month <= 7]Flanders in the summer, flat ground, and their aeroplanes overhead all day, looking.[else]The salient in the autumn. The gun has to be kept off the mud on a sheet of corrugated iron, and you sleep with the breech cover inside your shirt.[/if][else][if war.month <= 3]Winter in the salient, waiting for their big attack. The Lewis guns are the line now: posts spread out across the mud, a gun in each, and gaps between.[elif war.month <= 7]Since the retreat, in a new line through farmland, the gun in a hedge bottom with a field of young corn in front and the larks going up out of it all day.[else]Open country, going forward. The gun goes with the leading platoon, and you carry it across stubble and through gaps in hedges.[/if][/if][/if][if war.path == signals][if war.stage == 1][if war.month <= 9]Summer in the Loos country, chalk underfoot, and the cable's pinned along the trench wall with bent nails. A shell anywhere near brings it down.[else]Autumn in the old Loos line. Since the battle the lines are cut a dozen times a night, and the chalk's so wet the wire shorts out in it.[/if][elif war.stage == 2][if war.month <= 6]The Somme, before the push. The cable's being buried six feet down for the big attack, and until it's done the old lines run along the trench walls the way they always have.[elif war.month <= 9]The Somme in the summer, in ground that was theirs, where the only cable is what somebody ran out across the open.[else]The Somme in the autumn. The mud takes the cable down into it, and you find it by pulling it up out of the slime a yard at a time.[/if][elif war.stage == 3][if war.month <= 5]Arras: the signal office is a cellar under the town, warm and stale with the smell of paraffin, and the lines run out of it through the [if war.month <= 4]frost[else]chalk[/if] to every company.[elif war.month <= 7]Flanders in the summer. The ground's too wet to bury a cable deep, their guns are on the ridges, and every line along the canal bank is cut by noon.[else]The salient in the autumn. Lines don't last an hour in this mud, and half the messages go back by pigeon and runner anyway.[/if][else][if war.month <= 3]Winter in the salient. The wires run along the duckboard tracks, frozen stiff, and snap when they're bent.[elif war.month <= 7]Since the retreat, in a new line through farmland. The wire runs along hedges and over field gates, and last week the cows got at it.[else]Open country, going forward. The lines run out behind the advance across the fields, and a lorry or a gun team drives over them every hour.[/if][/if][/if][if war.path == snipe][if war.stage == 1][if war.month <= 9]Summer in the Loos country. There's a slag heap behind their line, and a German sniper on it somewhere, because men keep being hit in the same bay.[else]Autumn in the old Loos line, the craters full of rain. Their snipers are up in the ruins of the pit buildings; ours are down in the chalk.[/if][elif war.stage == 2][if war.month <= 6]The Somme, before the push, in a quiet sector the staff want kept quiet. The sniping officer wants their snipers kept down.[elif war.month <= 9]The Somme in the summer, among the smashed woods. Every stump could hold a sniper, and some of them do.[else]The Somme in the autumn. The light's poor and goes early, and there's no more than eight hours of it to see anything in.[/if][elif war.stage == 3][if war.month <= 5]Arras: the plate's set in a parapet of [if war.month <= 4]frozen [/if]chalk, and you go out to it in the dark[if war.month <= 4] over crusted snow[else], with the hawthorn behind the line sweet on the air[/if].[elif war.month <= 7]Flanders in the summer, flat land, their line on the low ridge. They look down on you all day, and you look up at them.[else]The salient in the autumn. The hide's in a smashed pillbox, the concrete cold and sweating, looking out over the mud to their line.[/if][else][if war.month <= 3]Winter in the salient, a few posts spread across the mud, and sniping's the one thing that goes on every day.[elif war.month <= 7]Since the retreat, in a new line through farmland. The hide's in a hedge, and their line runs along the edge of a wood across a field of young corn.[else]Open country, going forward, and their snipers are in the church towers and the attics of every village.[/if][/if][/if][if war.path == tunnel][if war.stage == 1][if war.month <= 9]Summer in the Loos country, under the chalk, where both sides have been mining since the spring. Chalk cuts clean, and it carries sound like a bell.[else]Autumn in the old Loos line, under the craters where the redoubt was. Their miners are working below you, and yours below them.[/if][elif war.stage == 2][if war.month <= 6]The Somme, before the push. There are mines going in under their line for the summer, big ones, and nobody's to talk about them. This gallery's one of the small ones.[elif war.month <= 9]The Somme in the summer. The big mines went up on the first of July, and the galleries that are left are for listening, and for small charges.[else]The Somme in the autumn. Water comes into the gallery faster than the pump can take it out.[/if][elif war.stage == 3][if war.month <= 5]Arras: the tunnellers have been digging all winter, under the town and out under the line, and you can walk a mile underground by electric light.[elif war.month <= 7]Flanders in the summer. The mines under the ridge went up in June and shook the billets twenty miles off, and now the galleries go down through wet sand into the blue clay.[else]The salient in the autumn. Up top it's mud; down here in the blue clay it's dry, and warm, and quiet.[/if][else][if war.month <= 3]Winter in the salient. There's hardly any mining left in the war, and most of the company's digging dugouts, but here both sides are still under the ground, listening.[elif war.month <= 7]Since the retreat the company's mostly digging deep dugouts for the new line, but under one old trench there's a gallery of theirs, and somebody's heard digging.[else]Open country, going forward, and the company's work is bridges and booby traps now. But the old line here has galleries under it, theirs and ours, and somebody's heard digging.[/if][/if][/if][if war.path == bearer][if war.stage == 1][if war.month <= 9]Summer in the Loos country. The aid post's in a miner's cottage in the village behind the line, and the carry back to it is a mile of chalk trench.[else]Autumn in the old Loos line. The men from September are still lying out in the beet in front of their wire, and nobody goes for them now. The bearers are for the living.[/if][elif war.stage == 2][if war.month <= 6]The Somme, before the push. The aid posts are being dug deeper and wider for the summer, and the bearers are learning the way to them in the dark.[elif war.month <= 9]The Somme, after the first of July. The carry back is a mile over ground that was theirs, and the trench you need is always the one that's been blown in.[else]The Somme in the autumn. It takes six men to carry one through this mud, and the carry back to the aid post can take four hours.[/if][elif war.stage == 3][if war.month <= 5]Arras: the dressing station's in the caves under the town, lit by electric bulbs, and the carry back to it is over [if war.month <= 4]frozen [/if]chalk.[elif war.month <= 7]Flanders in the summer, the ditches still running between the fields. The aid post's a concrete shelter on the canal bank.[else]The salient in the autumn. Six to a stretcher in this mud, and the carry back along the duckboards can take all night.[/if][else][if war.month <= 3]Winter in the salient, along the frozen duckboard tracks, the stretcher slipping every few yards.[elif war.month <= 7]Since the retreat, in a new line through farmland. The aid post's in a farmhouse kitchen, with the plates still on the dresser.[else]Open country, going forward, and the aid post moves every day. The carry back's longer every night.[/if][/if][/if][if war.path == tank][if war.stage == 3][if war.month <= 5]Arras country: chalk, and [if war.month <= 4]sleet[else]dust[/if], and the smashed suburbs of the town, and the roads choked with guns going up.[elif war.month <= 8]Flanders, flat and wet under the grass, and every road in the salient watched from their ridge.[else]Autumn, and the company's out of the salient, on chalk downland further south where the ground still drains, and nobody will say why.[/if][else][if war.month <= 3]Winter, the ruts frozen in the tank park, and talk all along the line of a German attack in the spring.[elif war.month <= 7][if flag.tk18_whippet]Since the retreat the Whippets have been kept back behind the new line, to go wherever a hole opens.[else]Since the retreat the line's new, scraped across farmland in front of Amiens, and nobody knows the ground.[/if][else]Open country now: stubble, hedges, villages with their roofs on, and the Germans going back.[/if][/if][/if][if war.path == air][if war.stage == 3][if war.month <= 7]Summer over Flanders. From up there the salient's a brown smear across the green, with the ruins of Ypres in the middle of it, white as bone.[else]The salient from the air in the autumn: shell holes lip to lip, and every one full of water, flashing up at you like broken glass.[/if][else][if war.month <= 3]Winter over the old salient, the ground white, their lines drawn on it in black like a pen drawing.[elif war.month <= 7]Since the retreat the squadron's on a new field further back, and the line below is new: farmland, hedges, villages that still have their roofs.[else]Open country under you now, and the line moving east every day, so the maps are out of date by the time they're printed.[/if][/if][/if]

    [if war.path == lewis && war.stake == 0]A raid is going over at two in the morning and the gun's to cover it. You set up in a sap head out past the wire with your No. 2 and four drums. The barrel shroud is so cold it burns your fingers through the mittens. When the raiders go, you fire short bursts over their heads at the German parapet, and every burst lights you up like a lamp in a window, and every German on that stretch can see exactly where you are.[/if][if war.path == lewis && war.stake == 1]A German two-seater comes over low in the evening, slow and fat and close enough to see the observer's goggles. The officer wants the gun up on its post for it. You'll be standing in the open with the gun pointing at the sky and your back to their line, firing up at it while it fires down at you.[/if][if war.path == signals && war.stake == 0]The line to battalion's gone again. Somewhere in the half mile of communication trench behind you a shell has cut it, and the colonel wants the company commander and can't have him. You take the pliers, a reel of D3 cable and the buzzer, and go along it in the dark, running the wire through your fingers, feeling for the break.[/if][if war.path == signals && war.stake == 1]The line to battalion's gone again, and this time it isn't in the trench. Between the front line and the support line the wire crosses a strip of the old no man's land, out on top, and something has cut it out there. Battalion is shouting into a dead telephone. Somebody has to go out and find the break.[/if][if war.path == bomb]A bombing raid tonight: eight of you, faces blacked with burnt cork, no cap badges, no pay books, a sandbag each of Mills bombs. Into their trench, along it a bay at a time, a prisoner if you can get one, and back before their machine guns wake up.[/if][if war.path == snipe]Before dawn you crawl into the hide in the parapet, a steel plate with a slit, a sack over the slit, your observer beside you with the telescope and the notebook. You stay till dark. They have snipers looking for this plate. Some mornings you see a man over there shaving in a bit of mirror, his braces down, and he puts you in mind of your father at the scullery sink.[/if][if war.path == tunnel]Down the shaft, along the gallery on your back on the trolley, to the face. Candle, the smell of wet clay and your own sweat. You lie with the listening stick against the clay and listen for them. If you can hear them digging, they're far enough off. If they stop, they're listening for you. If it goes quiet for a day, they've laid a charge.[/if][if war.path == bearer && war.stake == 0]A man of the night patrol is down out on the wire in front of the next company, and he's calling. The bearers are wanted. Four of you, a stretcher, the red cross on your arm, which is no use at all in the dark, and the flares going up over the place where the calling is.[/if][if war.path == tank][if war.stake == 0]The order comes at dusk: take her up to the line tonight, to a lying-up place behind the support trench, ready for a show in the morning. Four miles across country in the dark, at a walk, behind a guide with a lamp, along a white tape somebody has laid on the ground. Every yard of it, they'll hear you coming.[/if][if war.stake == 1]A tape's been laid from the tank park to the start line, and the guide is to meet you at the crossroads at ten. The nets come off, the engine has to be started, and then it's the whole night at a man's pace, with the shells feeling for the roads and the enemy listening for engines.[/if][/if][if war.path == air][if war.stake == 0]Your name's on the board in the flight office for the morning: a shoot with one of the heavy batteries, on a German battery in a wood that's been shelling the road. Up and down the same beat for an hour and more, straight and level, while the battery fires and the Archie gunners over the line get your height and keep it.[/if][if war.stake == 1]Your name's on the board for photographs tomorrow: the line opposite the corps, all of it, in strips, from five thousand feet, dead straight and dead level so the plates join up. Dead straight and dead level is what the German scouts like best, coming out of the sun.[/if][/if][if war.path == bearer && war.stake == 1]A man of the wiring party was hit at dusk and is lying in a shell hole thirty yards out. It's light enough now for their sniper to see the hole, and he has already hit the first man who went for him. The bearers are wanted.[/if]

    The work's yours now. You can say you're not fit for it. You'll usually be sent anyway.
  choices:
    - id: go
      text: "[if war.path == lewis]Take the gun up.[/if][if war.path == signals]Go.[/if][if war.path == bomb]Black your face and go.[/if][if war.path == snipe]Go out to the hide.[/if][if war.path == tunnel]Go down.[/if][if war.path == bearer]Take the stretcher and go.[/if][if war.path == tank]Take her up.[/if][if war.path == air]Get your coat and go out to the machine.[/if] ({mission_risk})"
      effects: [ { war: go } ]
      next: "@war"
    - id: decline
      text: Say you're not fit for it tonight.
      effects: [ { war: decline } ]
      next: "@war"

- id: w_sick
  chapter: front
  title: Rest
  text: |
    [if war.take == 0]Out at rest, in a barn behind the lines. Somebody's got a mouth organ going and somebody else is
    frying bread in a mess tin, and the smell of it should make you hungry. You hold your mug of
    tea in both hands so the others won't see it shake. It shakes anyway. The tea goes cold and you
    don't drink it.[else]Out at rest. You've slept twelve hours and you're more tired than when you lay down. Every time a door
    bangs in the farmyard you're flat on the straw before you know you've moved, and the others
    pretend they haven't noticed, which is kind of them, and you hate it.[/if]

    The medical officer holds a sick parade every morning at seven. He's a busy man, and a tired
    one, and he's seen everything.
  choices:
    - id: report
      text: Report sick. The medical officer may give you a tour out of the line.
      effects: [ { war: report } ]
      next: "@war"
    - id: carry_on
      text: Say nothing and carry on.
      effects: [ { war: carry_on } ]
      next: "@war"

- id: w_course
  chapter: front
  title: A course
  text: |
    The company sergeant major stops you at the water cart. There's a place going on a course,
    two weeks behind the lines, and he's put your name down unless you'd rather he didn't.

    [if war.course == lewis]The Lewis gun: twenty-eight pounds of it, a drum of forty-seven rounds on top like a gramophone record, and a temper. When it jams it jams in the worst place. The gun team are out of the attacks till they're needed and then they're needed more than anybody, and every German gunner looks for them first.[/if][if war.course == signals]Signals: flags, lamps, the buzzer, the field telephone and its miles of wire. When the wire's cut, and it's always cut, the signaller runs the message himself, across whatever's between him and battalion.[/if][if war.course == bomb]Bombing: the Mills bomb, pin and lever, four seconds. The bombers go first along an enemy trench, a bay at a time, and the men who come back from a bombing course don't joke about it.[/if][if war.course == snipe]Sniping: a rifle with a telescopic sight, a hide in the parapet, a partner with a periscope and a notebook. Hours of nothing. Then a second.[/if][if war.course == bearer]Stretcher-bearing: field dressings, splints, the tourniquet and when not to use it, and how four men carry a fifth through a trench built for one. The bearers carry no rifle. They go out to where the fire is because that's where the wounded are, and more of them are decorated than anybody, and more of them are killed.[/if][if war.course == lead]An NCO course: map reading, fire orders, how to keep a section together when the corporal's gone. They want men who can take charge.[/if]
    [if start == mill && war.course == lewis && war.mate2] Duckworth says his dad could strip one blindfold. "It's only a loom that shoots," he says.[/if]
  choices:
    - id: take
      text: Take it. Two weeks out of the line, and a trade after.
      effects: [ { war: take } ]
      next: "@war"
    - id: decline
      text: Stay with the section.
      effects: [ { war: decline } ]
      next: "@war"

- id: w_tunnel
  chapter: front
  title: The tunnellers
  text: |
    The Royal Engineers want miners. Six shillings a day against your one, out of the attacks, and
    work you know. The tunnellers do not go over the top. They go under it.
  choices:
    - id: transfer
      text: Go to the tunnellers. You will leave the section.
      effects: [ { war: transfer } ]
      next: "@war"
    - id: stay
      text: Stay with the men from home.
      effects: [ { war: stay } ]
      next: "@war"

- id: w_battle
  chapter: front
  title: "{battle_name}"
  text: |
    {phase_count} {phase_line}
  choices:
    - id: push
      text: "Push on. ({risk_push})"
      effects: [ { war: push } ]
      next: "@war"
    - id: help
      text: "Help the man beside you. ({risk_help})"
      effects: [ { war: help } ]
      next: "@war"
    - id: ground
      text: "Go to ground. ({risk_ground})"
      effects: [ { war: ground } ]
      next: "@war"
    - id: lead
      text: "[if war.stalled]Get up and [if war.battle == somme_autumn || war.battle == passchendaele]drag the section on through the mud.[else]get the section moving, wire or no wire.[/if][else][if war.battle == spring_offensive]Go along the bay and hold the section together.[else]Get them across: go out in front and take the section with you.[/if][/if] ({risk_lead})"
      visible_if: war.can_lead
      effects: [ { war: lead } ]
      next: "@war"

- id: w_leave
  chapter: front
  title: Home on leave
  text: |
    Ten days at home. The town has its own war now: the casualty lists in the paper, the women in
    the works, the houses with the blinds down.
    {section_line} {money_line} {offers_line}
  choices:
    - id: back
      text: "Go back. A stripe is waiting: [if war.corps == air]the squadron[else][if war.transferred]your company[else]the battalion[/if][/if] promotes the men who return."
      effects: [ { war: back } ]
      next: "@war"
    - id: commission
      text: Go before the board for a commission.
      visible_if: war.commission
      effects: [ { war: commission } ]
      next: "@war"
    - id: posting_0
      text: "Take it: {offer0}. Your war ends here."
      visible_if: "war.offers >= 1"
      effects: [ { war: "posting:0" } ]
      next: "@war"
    - id: posting_1
      text: "Take it: {offer1}. Your war ends here."
      visible_if: "war.offers >= 2"
      effects: [ { war: "posting:1" } ]
      next: "@war"
    - id: posting_2
      text: "Take it: {offer2}. Your war ends here."
      visible_if: "war.offers >= 3"
      effects: [ { war: "posting:2" } ]
      next: "@war"

- id: e_armistice
  chapter: end
  kind: ending
  ending: armistice
  title: The Armistice
  text: |
    {ending_line}

    Nobody cheers, where you are. The guns stop, and the silence comes down so hard that men look
    up at the sky as if something's wrong with it. Somebody starts to laugh and can't stop. A
    corporal sits down on an ammunition box and takes his boots off, both of them, right there in
    the open, and nobody tells him not to.

    You are {age} years old and {rank_a}, and you have been in France since you were a boy. You
    can smell the wet and the cordite and the horse lines, and under all of it, for the first time
    in years, nothing burning.

    Of the section from home, {friends_home} came home. Awards: {awards_line}. The record: {grade}.

- id: e_posting
  chapter: end
  kind: ending
  ending: posting
  title: Home
  text: |
    {ending_line}

    The war goes on without you. You read it in the paper over breakfast, like everybody else,
    the long columns in small print, and you read every name, every day, and you know some of them.

    Some nights you're glad. Some nights you lie awake in a proper bed with clean sheets, listening
    to the rain on the slates, and you'd give anything to be in a wet bay with the lads, and you
    couldn't say to anybody why.

    [if flag.ro_sw_first][if flag.ro_sw_ended || flag.ro_sw_jilted]{sweetheart} is married to somebody else. You see her in the street with a pram, and she smiles, and you lift your cap.[else][if flag.ro_sw_married]You're home with {sweetheart}, in a house of your own, with the war in the paper on the table between you every morning.[else][if flag.ro_sw_wed16 || flag.ro_sw_wed17]You marry {sweetheart} that spring, in your uniform because it's the best thing you have.[else][if flag.ro_sw_after || flag.ro_sw_wait2]{sweetheart} didn't have to wait till it was over after all. You're married that spring.[else]You walk out with {sweetheart} on Sundays, the way you did before.[/if][/if][/if][/if][/if][if flag.ro_fr_promise || flag.ro_fr_address] Now and then a letter comes from France, from Marthe. You answer every one.[/if]

    Of the section from home, {friends_home} came home. Awards: {awards_line}. The record: {grade}.

- id: e_captured
  chapter: end
  kind: ending
  ending: captured
  title: Taken
  text: |
    {ending_line}

    A boy in grey with a rifle bigger than he is takes your water bottle and your cigarettes and,
    after a moment, gives you one of the cigarettes back. You walk east all day with your hands on
    your head, then without, past their guns and their horses and their wounded, who look exactly
    like yours.

    The rest of your war is behind wire: black bread, turnip soup, work in a salt mine or on a
    farm, letters that take months. Your mother gets a card in your handwriting from a camp with a
    name she can't say, and she takes it round to every house in the street.

    [if flag.ro_sw_first][if flag.ro_sw_ended || flag.ro_sw_jilted]{sweetheart} hears from your mother that you are missing, and then that you are a prisoner, and says she's glad you're out of it.[else][if flag.ro_sw_married]{sweetheart} is told you are missing, and for weeks she doesn't know if she's a wife or a widow. Then the card in your hand comes through the Red Cross. She sends a parcel every week after that, and half of them never reach you.[else][if flag.ro_sw_wed16 || flag.ro_sw_wed17]{sweetheart} waits for the card through the Red Cross like everyone else, and then writes to the camp every week. One letter in three reaches you. You keep them all, in your cap.[else][if flag.ro_sw_after || flag.ro_sw_wait2]{sweetheart} writes to the camp every week. One letter in three reaches you. She is still waiting, she says. Now it's a different kind of waiting.[else]{sweetheart} writes to the camp now and then, through the Red Cross.[/if][/if][/if][/if][/if][if flag.ro_fr_writes || flag.ro_fr_promise] Somewhere a letter from Marthe is lying in a sorting office, addressed to a man who isn't there.[/if]

    Of the section from home, {friends_home} came home. Awards: {awards_line}. The record: {grade}.

- id: e_invalided
  chapter: end
  kind: ending
  ending: invalided
  title: Wounded out
  text: |
    {ending_line}

    [if war.end_cause == battle && war.corps != tank && war.corps != air]You lie where you fell till the light goes, and the stretcher-bearers find you by your calling. You don't remember calling.[/if][if war.end_cause == shell && war.corps != air]The shell comes down in the bay and the next thing you know you're on the duckboards with a man you don't know kneeling on your arm to stop the bleeding.[/if][if war.end_cause == sortie]Out in front, in the dark. The others drag you back through the wire on a groundsheet, and every yard of it you feel.[/if][if war.end_cause == assign || war.end_cause == other || war.end_cause == underground]It happens fast, the way it always does, and then for a long while nothing happens at all.[/if][if war.corps == tank && war.end_cause != sortie]Splinters and the heat inside her, and then you're on the ground beside her tracks, and somebody is cutting your sleeve off.[/if][if war.corps == air && war.end_cause != sortie]The pilot gets the machine down on our side of the line, and men run out to you from a battery, and you don't remember the landing.[/if]

    Morphia at the dressing station, a label tied to your tunic button, the clearing station, the ambulance train. The hospital ship smells of carbolic and vomit and the sea. In England a woman gives you tea with sugar in it, and you cry like a child and can't stop, and she just holds the cup for you till you can.

    Weeks in a hospital bed. Then a medical board: three officers at a table, your papers, a doctor's hand on the wound. No longer physically fit for war service. They give you a paper to say so, and a pension of a few shillings a week, by the size of the wound.

    You go home in hospital blue, then in your own clothes that don't fit. [if war.stage >= 3 || war.stage == 2 && war.month >= 9]A silver badge on your lapel, so that nobody in the street hands you a white feather.[else]In the street a girl you've never seen pushes a white feather into your buttonhole, because you're young and out of uniform, and you let her.[/if] The wound aches when it rains.

    [if start == mill]The mill takes you back on lighter work, sweeping and carrying for the tacklers, and the women in the weaving shed stop the looms for a minute when you come in, and then start them again.[/if][if start == pit]You can't go back down. They find you a job on the screens at the pit head, picking stone out of the coal with the old men and the boys, and every morning you watch the cage go down without you.[/if][if start == farm]Your father puts you on the light work, and doesn't say anything about it, and gets up an hour earlier himself so there's less for you to do.[/if][if start == city]The firm keeps your desk, as it promised. The other desks fill with women and old men, and the casualty lists go up in the front hall, and you read them every morning before you take your coat off.[/if][if war.mate1 || war.mate2 || war.mate3] Letters come from the section. You read the names in them, and the names that aren't in them.[/if]

    [if flag.ro_sw_first][if flag.ro_sw_ended || flag.ro_sw_jilted]{sweetheart} is walking out with somebody else now. She crosses the road to say she's glad you're home, and she means it.[else][if flag.ro_sw_married]{sweetheart} meets every train for a week till yours comes. She doesn't look at the wound first. She looks at your face.[else][if flag.ro_sw_wed16 || flag.ro_sw_wed17]You marry {sweetheart} in the spring, by licence, in your hospital blue because your suit won't go over the bandages, and the ringers ring what bells they can.[else][if flag.ro_sw_after || flag.ro_sw_wait2]{sweetheart} said she would wait till it was over, and it's over for you sooner than either of you thought, and not whole. You're married in the spring.[else]{sweetheart} comes to see you the first Sunday. You walk, slowly, and she doesn't hurry you.[/if][/if][/if][/if][/if][if flag.ro_fr_promise || flag.ro_fr_address] You write to Ternecourt. A letter comes back after a long while: Marthe is glad you are alive, and she does not say what else.[/if]

    Of the section from home, {friends_home} came home. Awards: {awards_line}. The record: {grade}.

- id: e_broken
  chapter: end
  kind: ending
  ending: broken
  title: Shell shock
  text: |
    {ending_line}

    It's your hands first. You look down and they won't stop, and then it's your legs, and then
    you're lying in the bottom of the trench and you can hear somebody making a noise like a
    kicked dog and it's you. They carry you down the line on a stretcher, though there's not a
    mark on you, and you're ashamed of that the whole way.

    The doctors call it neurasthenia. At home a door banging sends you under the table. Your
    mother learns to close them quietly. Your father doesn't talk about it, which is how he
    talks about it.

    [if flag.ro_sw_first][if flag.ro_sw_ended || flag.ro_sw_jilted]{sweetheart} hears you're home, and ill, and sends a card with violets on it, and doesn't come.[else][if flag.ro_sw_married]{sweetheart} sits with you in the evenings when your hands won't stop. She doesn't ask. When a door bangs she's between you and it before you know.[else][if flag.ro_sw_wed16 || flag.ro_sw_wed17]{sweetheart} comes to the hospital. The first time you can't speak to her. The second time you can. The wedding waits a year, and then it doesn't.[else][if flag.ro_sw_after || flag.ro_sw_wait2]{sweetheart} comes to the hospital, and comes again, and says she'll wait, and does.[else]{sweetheart} writes to the hospital, short letters about the weather and the village, which are the only kind you can read.[/if][/if][/if][/if][/if][if flag.ro_fr_promise || flag.ro_fr_address] A letter from Marthe comes to the house. It's a year before you can answer it, and by then there's nobody left at that address.[/if]

    Of the section from home, {friends_home} came home. Awards: {awards_line}. The record: {grade}.

- id: e_court
  chapter: end
  kind: ending
  ending: court_martial
  title: Court-martial
  text: |
    {ending_line}

    The court sits in a schoolroom behind the lines, three officers at a table with the children's
    sums still on the blackboard behind them. Nobody asks how long you'd been in the line. You
    don't know how to tell them about the noise. It takes twenty minutes.

    Most sentences are commuted. Most men go to prison, or back to the line under a cloud that
    follows them into every bay. Your name goes in the paper at home, or it doesn't, and either way
    your mother stops going to chapel.

    [if flag.ro_sw_first][if flag.ro_sw_ended || flag.ro_sw_jilted]{sweetheart} reads your name in the paper, or hears it, and doesn't say anything to anybody.[else][if flag.ro_sw_married]{sweetheart} goes on going to chapel, and sits where everyone can see her, every Sunday.[else][if flag.ro_sw_wed16 || flag.ro_sw_wed17]{sweetheart}'s father forbids her to write to you. She writes anyway, once, and it's the only letter you get.[else][if flag.ro_sw_after || flag.ro_sw_wait2]{sweetheart}'s father forbids her to write to you. She writes anyway, once, and it's the only letter you get.[else]You don't write to {sweetheart}. You can't think what to say.[/if][/if][/if][/if][/if]

    Of the section from home, {friends_home} came home. Awards: {awards_line}. The record: {grade}.

