# Phase 1 placeholder content: character creation, one scene per question the war asks, and
# the endings. Plain words, period-true; the voice is settled at calibration (DESIGN §13).
# Every decision scene's choices run one `war:` effect and then go to "@war": the content loader
# replaces that with the one route in content/route.yaml (the scene for the war's next question,
# an authored scene that takes it over, or the ending).

- id: c_enlist_mill
  chapter: enlist
  checkpoint: true
  title: The drill hall
  text: |
    The queue starts at the drill hall door and goes back past the Co-op and round into Bury Road.
    Somebody has chalked GOD SAVE THE KING on the wall, and under it somebody else has put AND OUR
    ALBERT, and Albert Shaw is stood right in front of it pretending he can't read.

    It's warm for September. The street smells of the mill on a hundred men at once: machine oil,
    cotton fluff in their hair, the sour sweat of the weaving shed. Without the looms going your
    ears feel hollow, the way they do on a Sunday.

    The recruiting sergeant doesn't shout. He's like a good tackler: he doesn't need to.

    "Age?"

    "Just turned {age_words}, sir."

    Behind you Walter Pilling is going to say nineteen. Walter Pilling was born the same winter as
    your sister, and everybody in the queue knows it, and nobody says a word.
    [break]
    What you take with you from the shed is what you'll have out there.
  choices:
    - id: pick_0
      text: The knack you have with a loom, and legs for a ten-hour day.
      effects: [ { war_home: [mech, stamina] } ]
      next: c_general
    - id: pick_1
      text: The knack you have with a loom, and the voice that leads the chapel choir.
      effects: [ { war_home: [mech, voice] } ]
      next: c_general
    - id: pick_2
      text: Legs for a ten-hour day, and the voice that leads the chapel choir.
      effects: [ { war_home: [stamina, voice] } ]
      next: c_general

- id: c_enlist_pit
  chapter: enlist
  checkpoint: true
  title: The Miners' Hall
  text: |
    The queue comes out of the Miners' Hall door and goes down past the Store and the Primitive
    Methodist chapel nearly to the pit gates, and behind it the winding wheel's still turning,
    because the fore shift isn't up yet. When they do come up they come straight over, black to the
    eyes, bait tins under their arms, and join the end of it, and nobody tells them to go home and
    wash first.

    The colliery band played the first lot to the station in August. They're not playing today.
    They're in the queue.

    The street smells of the pit on a hundred men: coal dust and wet pit clothes and sweat, and
    over it all the sulphur off the heap that's been burning since before you were born. There's a
    blue mark on every forehead and every set of knuckles, where the coal got into a cut and healed
    in.

    The manager came down this morning in his good coat and said coal was war work too. Jim Bell
    asked him if coal would pay the widows, and the manager went red and went home.

    "Age?"

    "Just gone {age_words}, sir."

    Tommy Robson's in front of you, your marra at the face these two years, saying nothing, which
    is how Tommy says most things. George Charlton's behind you, still smelling of the stables,
    because he went down the pit last night to tell his pony he was going.
    [break]
    What you bring from underground is what you'll have out there.
  choices:
    - id: pick_0
      text: Digging and timbering, and a back for a long shift.
      effects: [ { war_home: [dig, stamina] } ]
      next: c_general
    - id: pick_1
      text: Digging and timbering, and a hand with the engines and the pumps.
      effects: [ { war_home: [dig, mech] } ]
      next: c_general
    - id: pick_2
      text: A back for a long shift, and a hand with the engines and the pumps.
      effects: [ { war_home: [stamina, mech] } ]
      next: c_general

- id: c_enlist_city
  chapter: enlist
  checkpoint: true
  title: Guildhall
  text: |
    The queue goes out of the Guildhall yard and down Gresham Street and round into Basinghall
    Street, four deep, and every man in it is wearing a bowler hat. Clerks. From the insurance
    offices and the banks and the shipping firms, from every desk in the City, come out at dinner
    time with their sandwiches in their pockets and stood in the queue instead.

    It's warm for September. The street smells of horse dung and hot stone and the river, and of
    the City on a hundred men: ink, brilliantine, the starch in a hundred stiff collars. A man in
    front of you is still holding a ledger.

    The manager came round the office at eleven and shook every man's hand and said the Gresham
    and Lombard would make up their salaries for as long as it lasted. Arthur Webb, from the next
    desk, wrote it down. Percy Fenton was out of the door before the manager finished. Leonard Marsh
    sat up half the night with a card from the optician's, learning the letters.

    The sergeant writes your name. "Age?"

    "Just turned {age_words}, sir."
    [break]
    What you bring from the office is what you'll have out there.
  choices:
    - id: pick_0
      text: A clerk's head for reading and figures, and a bowler's arm from Saturday cricket.
      effects: [ { war_home: [lit, sport] } ]
      next: c_general
    - id: pick_1
      text: A clerk's head for reading and figures, and the St John Ambulance certificate.
      effects: [ { war_home: [lit, firstaid] } ]
      next: c_general
    - id: pick_2
      text: A bowler's arm from Saturday cricket, and the St John Ambulance certificate.
      effects: [ { war_home: [sport, firstaid] } ]
      next: c_general

- id: c_enlist_farm
  chapter: enlist
  checkpoint: true
  title: Harvest home
  text: |
    The harvest's in, and the harvest supper's in the big barn at Court Farm, the way it is every
    year: trestle tables, a ham, cider from the squire's own press, the fiddler from Brendon, and
    the barn still smelling of the corn it held all summer. Only this year the squire stands up at
    the end with a paper in his hand, and there's a recruiting sergeant beside him in a red sash,
    and nobody's dancing.

    The squire's son, young Mr Venn, is taking a commission. He'll have a platoon, the squire says,
    and he'd like it to be Dunsworthy men.

    Will Cottle puts his tankard down and stands up first, because his father's looking at him and
    he can't bear it. Dan Pearce stands up because Will has, and because it's further from the
    keeper. Bert Yeo, who rang the bells for the harvest thanksgiving that morning, stands up
    because everybody else is.

    The sergeant writes your name. "Age?"

    "Just gone {age_words}, sir."
    [break]
    What you bring from the land is what you'll have out there.
  choices:
    - id: pick_0
      text: A shotgun and a poacher's eye, and the legs to walk the moor all day.
      effects: [ { war_home: [field, stamina] } ]
      next: c_general
    - id: pick_1
      text: A shotgun and a poacher's eye, and a hand with the threshing engine.
      effects: [ { war_home: [field, mech] } ]
      next: c_general
    - id: pick_2
      text: The legs to walk the moor all day, and a hand with the threshing engine.
      effects: [ { war_home: [stamina, mech] } ]
      next: c_general

- id: c_general
  chapter: enlist
  title: The last night
  text: |
    Your mother has sewn your name into everything you own. The kitchen smells of hot iron and the
    starch she's put in your collars, which the army will take off you in a week. She's not
    talking much. She keeps finding things to fold.

    There's one more thing you've got that the army didn't give you.
  choices:
    - id: firstaid
      text: First aid. The ambulance class at the works, certificate in a frame.
      effects: [ { war_general: firstaid } ]
      next: c_training
    - id: sport
      text: A throwing arm. Second eleven, and you can hit a stump from the boundary.
      effects: [ { war_general: sport } ]
      next: c_training
    - id: voice
      text: A voice. When you start a hymn, men join in.
      effects: [ { war_general: voice } ]
      next: c_training

- id: c_training
  chapter: enlist
  title: Training
  text: |
    Eight months of it. Huts with floors that never dry. Drill in your own clothes till Christmas,
    then in blue serge, then at last in khaki that smells of the store and makes your neck raw.
    Route marches in the rain until your feet are one blister and then they harden and you stop
    noticing. Digging practice trenches in a field and filling them in again. Bayonet drill on
    sacks of straw, the corporal yelling at you to scream, and you feel daft screaming, and then
    one day you don't.

    You learn to sleep anywhere. You learn to eat anything. You learn the men from home all over
    again, the way you never knew them [if start == mill]in the shed[/if][if start == pit]at the face[/if][if start == city]across the office[/if][if start == farm]in the fields[/if]: who snores, who cries, who shares.

    In May the orders come. France.

    {section_line}
  choices:
    - id: embark
      text: Go aboard.
      effects: [ { war_run: true } ]
      next: "@war"

- id: w_tour
  chapter: front
  title: In the line
  text: |
    [if war.back_from_leave && war.corps != tank]Back from leave. You remember the railhead, the smell of horse dung and wet canvas and coal smoke, and the day and a half it took to come back, and home already doesn't seem real. [/if][if war.back_from_leave && war.corps == tank && war.stage == 4]Back from leave. You remember the railhead, the smell of horse dung and wet canvas and coal smoke, and the day and a half it took to come back, and home already doesn't seem real. [/if][if war.corps != tank && war.corps != air][if war.month == 1 && war.take == 0]January. The ground's iron and the bully beef comes up frozen in the tin. You rub whale oil into your feet every morning, under the eye of a corporal, because trench foot is a crime now, and the oil stinks of fish and the cold gets in anyway.[/if][if war.month == 1 && war.take == 1]January. Frost on the wire in the morning, every barb furred white. The braziers fill the dugouts with coke fumes that give you a headache like a hammer, and you sit in them anyway, because outside your breath freezes on your scarf.[/if][if war.month == 2 && war.take == 0]February, and the thaw. The trench walls go soft and slide in, a bay at a time, and you dig them out and they slide in again. The rats are fat from the winter. One runs over your face in the night and you've stopped waking up for it.[/if][if war.month == 2 && war.take == 1]February. Wet, and then wetter. The duckboards float. Everything you own is damp, your blanket, your socks, your bread, and the whole line smells of wet wool and wet earth and the latrine.[/if][if war.month == 3 && war.take == 0]March. Rain on the wind, and the wind straight off the German line, so it smells of them: their cooking, their tobacco, their latrines. The pumps go all night and the water comes back in all day.[/if][if war.month == 3 && war.take == 1]March. A raw grey month. The sky sits on the trench like a lid. You don't feel your feet from one end of the tour to the other.[/if][if war.month == 4 && war.take == 0]April. Green coming through the churned ground in no man's land, thin and bright, as if nobody had told the grass. At night the frogs croak in the shell holes, a whole chapel choir of them.[/if][if war.month == 4 && war.take == 1]April. Showers and sun, both in an hour. Behind the lines there's blossom on the orchard trees by the billets, and you stand under it with your mess tin and can't take it in.[/if][if war.month == 5 && war.take == 0]May. Warm enough to take your tunic off in the support line. The flies are starting, and the smell from no man's land is starting with them.[/if][if war.month == 5 && war.take == 1]May. The hawthorn's out along the roads behind the lines, white as washing, and the smell of it comes up the communication trench at dusk, sweet, and then the other smell, underneath.[/if][if war.month == 6 && war.take == 0]June. The nights are so short that stand-to is at three in the morning, and the sky's going grey before you've got your boots dry. The water comes up in petrol tins and tastes of petrol and chloride.[/if][if war.month == 6 && war.take == 1]June. Dust, and flies, and the long light evenings. You can read a letter on the firestep at ten at night, and you do, over and over.[/if][if war.month == 7 && war.take == 0]July. Heat. The flies are on everything: the jam, the bread, your mouth if you leave it open. Thirst all day. The sandbags are hot to the touch at noon.[/if][if war.month == 7 && war.take == 1]July. The trench bakes. Men sleep in the afternoon in whatever shade the parapet gives, faces covered with their caps against the flies.[/if][if war.month == 8 && war.take == 0]August. Thunderstorms in the night that you mistake for guns, and guns you mistake for thunder. Behind the lines the French women are getting the harvest in by hand, and they don't look up at the columns going past.[/if][if war.month == 8 && war.take == 1]August. Wasps at the jam tins and the heavy smell of hay from the fields behind the lines, and a storm every few nights that fills the trench to your knees.[/if][if war.month == 9 && war.take == 0]September. Mist in the mornings, low on the ground, so that at stand-to the German line isn't there and then is. Blackberries in the hedges behind the billets; you eat them till your fingers are purple.[/if][if war.month == 9 && war.take == 1]September. The nights drawing in. The air smells of turned earth and the first fires of the year in the farmhouses behind the lines.[/if][if war.month == 10 && war.take == 0]October. Rain, and the mud comes back like an old enemy. Greatcoats again. The leaves are coming down off the last trees in the wood behind the support line, what's left of the trees.[/if][if war.month == 10 && war.take == 1]October. A wet, rotten month. Your puttees never dry. The rum ration starts again and you've never been so glad of anything.[/if][if war.month == 11 && war.take == 0]November. Fog. Dark by half past four. You stand on the firestep in a world the width of your own arm, and every sound in it is close.[/if][if war.month == 11 && war.take == 1]November. Cold rain that turns to sleet at night. The rum comes round at stand-to in the morning and you hold it in your mouth as long as you can, for the warmth.[/if][if war.month == 12 && war.take == 0]December. Frost again, and the parcels start coming up from home: plum puddings in tins, mufflers, socks, a cake from the Co-op in greaseproof paper. The post corporal is the most popular man in the battalion.[/if][if war.month == 12 && war.take == 1]December. The short days. You're in the dark at both ends of every working party. Somebody in the next bay is singing a carol under his breath, badly, and nobody stops him.[/if][/if][if war.corps == tank][if war.month == 1 && war.take == 0][if war.stage == 3]January, at Wool, in Dorset. Huts on a heath, a wind straight off the sea, and sentries round a shed you aren't allowed near yet. You learn the engine off a blackboard in a hut that smells of wet greatcoats and paraffin, and every night you start a letter home and can't think what you're allowed to put.[else]January at the tankodrome. Frost on the tracks in the morning, and the tanks stood in rows under their nets like cattle in a frozen field. The fitters work with their gloves off and blow on their fingers between every nut.[/if][/if][if war.month == 1 && war.take == 1][if war.stage == 3]January. The ranges at Lulworth, on the cliffs, firing out over a grey sea. The wind takes your breath and the gun jumps in the cold, and between shoots you stand behind a hut stamping your feet and watching the gulls hang in the air over the targets.[else]January. The tank park is mud frozen into ruts the shape of the tracks, so every tank that moves lurches like a drunk. The crews sleep in a hut with a stove that glows red and warms a yard of air round it.[/if][/if][if war.month == 2 && war.take == 0][if war.stage == 3]February, and France: Bermicourt, a village with a chateau full of staff officers, and the workshops at Erin down the road. You learn her on the drill ground, round and round in the frozen mud, the gearsmen at the back working the levers when the hammer knocks on the engine cover.[else]February. The camouflage nets are stiff with frost and tear when you pull them. You spend the short days patching and painting her for the spring, and the paint won't dry in the cold.[/if][/if][if war.month == 2 && war.take == 1][if war.stage == 3]February at Erin. A town of sheds going up in a field, aeroplane hangars, the first engines hung up on chains, and fitters in overalls who've never seen the line and talk about it as if they had. Murray walks along the rows of plates rapping the rivets with his knuckle and shaking his head.[else]February. Every week the word comes that they're coming, and every week they don't. You kick a tin about the tank park and listen to the guns on the horizon, east, steady as a pump.[/if][/if][if war.month == 3 && war.take == 0]March. A cold wind across the tank park that gets in at the rivets and whistles. The nets flap on their poles all night like washing that won't dry.[/if][if war.month == 3 && war.take == 1]March. Mud again. A tank going out to the practice ground throws it off her tracks in clots the size of loaves, and the crew come back caked to the eyes.[/if][if war.month == 4 && war.take == 0]April. Rain and sun by turns, and the sheds steaming when the sun comes out. There are fitters everywhere with spanners, because there's a show coming, and everybody knows it, and nobody says where.[/if][if war.month == 4 && war.take == 1]April. Lying up in a wood with the tanks under nets, the trees just coming into leaf over them. A blackbird sings on her roof. In the evening the crews sit on the tracks and smoke, and the steel's still warm from the day.[/if][if war.month == 5 && war.take == 0]May. Warm at last. You take the guns out of her and strip them on a groundsheet in the sun, every part laid out in a row like knives in a drawer, and the oil smells sweet in the heat.[/if][if war.month == 5 && war.take == 1]May. Hawthorn along the lanes behind the tank park. Inside her in the afternoon the steel's too hot to lean on, and you work in your vest, and the sweat runs into your eyes.[/if][if war.month == 6 && war.take == 0]June. Inside her it's an oven before nine in the morning. The heat comes off the engine in waves and the fumes with it, and when you climb out the fresh air goes to your head like beer.[/if][if war.month == 6 && war.take == 1]June. Long light evenings. The crews dig the tanks in and string the nets over them, and lie on the grass underneath reading old papers, with the smell of hot oil and cut grass mixed.[/if][if war.month == 7 && war.take == 0]July. The tank park is dust. It gets in the bearings, in the tea, in the bread, in your ears, and the fitters curse it all day. The water's rationed, and you shave in the dregs of your tea.[/if][if war.month == 7 && war.take == 1]July. Thunder at night, and you lie awake in the hut counting, and it isn't guns, and then it is. In the morning the nets are full of rainwater, and somebody always forgets and pulls one.[/if][if war.month == 8 && war.take == 0]August. Heat, and wasps at the jam, and the harvest coming in round the tank park, French women with sickles who don't look up when a tank goes by.[/if][if war.month == 8 && war.take == 1]August. A smell of hot metal and hay. You grease the tracks link by link in the sun, and the grease runs, and the flies come to it in clouds.[/if][if war.month == 9 && war.take == 0]September. Mist in the mornings over the tank park, so the tanks come out of it one at a time like cows out of a field. The nights in the huts are getting cold again.[/if][if war.month == 9 && war.take == 1]September. Blackberries in the hedge behind the workshops. The fitters pick them in their breaks with black oily fingers, and the berries taste of petrol.[/if][if war.month == 10 && war.take == 0]October. Rain. The tank park goes back to mud, and she sinks into it a little more every night where she stands, as if she were tired.[/if][if war.month == 10 && war.take == 1]October. The leaves coming down on the nets. Greatcoats again, and the stove lit in the hut, and the smell of wet wool drying.[/if][if war.month == 11 && war.take == 0]November. Fog over the tank park, thick and yellow. You find her by the smell of oil and walk round her twice before you're sure she's yours.[/if][if war.month == 11 && war.take == 1]November. Short days. You work on her by a hurricane lamp in the afternoons, and your fingers go dead on the cold steel.[/if][if war.month == 12 && war.take == 0]December. Frost, and parcels from home. You eat your Christmas cake sitting on a track, out of the wind, in your greatcoat.[/if][if war.month == 12 && war.take == 1]December. The short days, and the nets white with frost every morning. Somebody has tied a sprig of holly to a gun mounting.[/if][/if][if war.corps == air][if war.month == 1 && war.take == 0]January. Snow on the field, and the machines stand in the hangars with their engines wrapped in sacking. The oil's like treacle in the mornings; Sallis warms it on a primus before he'll start one. In the hut the stove's red, and your bed's an arm's length from it.[/if][if war.month == 1 && war.take == 1]January. Too cold for flying most days, and nobody's sorry. When you do go up, the cold at height gets into your teeth till the fillings ache, and the gun oil thickens so the Lewis fires slow, like a man stammering.[/if][if war.month == 2 && war.take == 0]February. Low cloud and rain, and the field's a bog. The wheels throw mud up over the lower wings on take-off, and the riggers scrape it off with their hands. Days in the hut, playing nap for matches.[/if][if war.month == 2 && war.take == 1]February. A hard frost and a clear blue sky, which means flying, all day. You come down with your face stiff under the whale oil, and for ten minutes your mouth won't make words.[/if][if war.month == 3 && war.take == 0]March. The wind's gone round to the east. Every dawn the mechanics are out on the field in the dark, running the engines up, and the noise goes round the aerodrome like a threshing day.[/if][if war.month == 3 && war.take == 1]March. Rain, and the machines grounded, and the cards out in the hut. The east wind brings the guns with it at night.[/if][if war.month == 4 && war.take == 0]April. Larks over the aerodrome from first light, going up and up, singing, as if nobody had told them about any of it.[/if][if war.month == 4 && war.take == 1]April. Showers and sun, both in an hour, and rainbows over the field. You fly through a shower at three thousand feet and come out of it soaked through and freezing, with the sun in your eyes.[/if][if war.month == 5 && war.take == 0]May. Long light evenings. The machines go up after tea and come down in the dusk, and the field smells of cut grass and petrol and the stew from the cookhouse.[/if][if war.month == 5 && war.take == 1]May. From two thousand feet the hawthorn shows white in every hedge, and the whole country's drawn out under you in chalk lines, like a map on a schoolroom wall.[/if][if war.month == 6 && war.take == 0]June. Haymaking in the fields round the aerodrome. The French women used to look up from their rakes when the machines came in low over them. They don't any more.[/if][if war.month == 6 && war.take == 1]June. Thunderheads building up in the afternoons, white and tall, and no pilot will go near one. At night you sleep between sheets with the hut door open, and hear the guns like a cart on cobbles, a long way off.[/if][if war.month == 7 && war.take == 0]July. Heat on the field, and the dope on the wings smells stronger in the sun, sweet and sickly. On the ground you sweat in your shirt. Two miles up your feet are still cold.[/if][if war.month == 7 && war.take == 1]July. You fly in the morning, before the haze comes up. In the afternoon you lie on the grass in the shade of a hangar with your cap over your face and listen to the riggers singing.[/if][if war.month == 8 && war.take == 0]August. Rain on the hangar roofs at night like gravel thrown on a drum, and the cloud down on the poplars in the morning, and no flying, and nobody minds.[/if][if war.month == 8 && war.take == 1]August. Harvest in the fields round the aerodrome, the stooks standing in rows. From the air they look like stitches in a sack.[/if][if war.month == 9 && war.take == 0]September. Mist on the field at dawn so thick the machines wait in the hangar mouths with their engines ticking over, and the mechanics stand about with their hands in their pockets, waiting for the sun.[/if][if war.month == 9 && war.take == 1]September. The swallows sit along the wires by the hangars in rows, getting ready to go. Sallis says they go to Africa. He says it as if he'd like to go with them.[/if][if war.month == 10 && war.take == 0]October. Rain, and more rain. Days without flying, the cloud down on the poplars, the wind slapping the hangar canvas, and a fug of wet wool and pipe smoke in the hut.[/if][if war.month == 10 && war.take == 1]October. The first frost on the wings in the mornings. Sallis scrapes it off with the edge of his hand before anybody's let climb in.[/if][if war.month == 11 && war.take == 0]November. Fog on the field till noon, and dark by half past four. The machines hardly go up.[/if][if war.month == 11 && war.take == 1]November. Cold rain blowing across the field, and the windsock hanging heavy and wet on its pole.[/if][if war.month == 12 && war.take == 0]December. Frost, and the parcels coming up from home. Sallis gets a cake from Coventry and cuts it into sixteen with a hacksaw blade.[/if][if war.month == 12 && war.take == 1]December. The short days. Somebody's put a tree in a petrol tin in the hut, with spent cartridge cases hung on it for baubles.[/if][/if][if war.back_from_wound && !war.transferred] You're back with the battalion, the wound pulling every time you lift your arm, and the lads look at you as if you'd been somewhere they'd rather be.[/if][if war.back_from_wound && war.transferred] You're back with the [if war.corps == air]squadron[else]company[/if], the wound pulling every time you lift your arm, and the crew make you a brew without being asked.[/if][if war.lost_last == 1 && !war.transferred] {lost_last_name}'s place on the firestep has somebody from the draft in it, a lad who doesn't know where to put his feet.[/if][if war.lost_last >= 2 && !war.transferred] There are gaps in the section now. You keep looking for faces that aren't there.[/if][if war.lost_last >= 1 && war.transferred && war.take == 0] Word comes over from the battalion of men from home gone since. You hear it, and [if war.corps == tunnel]go down the shaft[else]go back to the work[/if].[/if][if war.lost_last >= 1 && war.transferred && war.take == 1 && war.corps != tank] A battalion man at the water point tells you who's gone from home since. You don't ask him to say it twice.[/if][if war.lost_last >= 1 && war.corps == tank && war.take == 1 && war.tour >= 22] A battalion man at the water point tells you who's gone from home since. You don't ask him to say it twice.[/if][if war.promoted_last && war.rank <= 4] The new stripe is sewn on crooked. Men who were your mates last week say '[if war.rank <= 2]Corporal[/if][if war.rank >= 3]Sarge[/if]' in a voice that isn't quite their own.[/if][if war.promoted_last && war.rank >= 6] Another pip on your cuff, sewn on by your servant by candlelight.[if war.rank == 7] You have the company now, what's left of it, and a captain's worries with a lieutenant's pay until the paper comes through.[/if][/if][if war.award_last] The {award_last_name} is in battalion orders. Nobody says a word about it to your face, and everybody talks about it behind your back.[/if][if war.detailed_last == wiring] Last tour the sergeant put you on a wiring party.[/if][if war.detailed_last == patrol] Last tour you were sent out on a patrol.[/if][if war.detailed_last == raid] Last tour they put you on a raid, whether you liked it or not.[/if][if war.detailed_last == listening] Last tour you did a stint in a listening post.[/if][if war.detailed_last == carrying] Last tour you were on a carrying party, two miles of trench each way.[/if][if war.detailed_last == bomb || war.detailed_last == lewis || war.detailed_last == snipe || war.detailed_last == signals || war.detailed_last == tunnel || war.detailed_last == bearer || war.detailed_last == tank || war.detailed_last == air] Last tour they sent you out on your own work, though you'd said you weren't fit.[/if][if war.detailed_last != none && war.detailed_ok] It went all right.[/if][if war.detailed_last != none && !war.detailed_ok] It went wrong, the way these things do.[/if]
  choices:
    - id: on
      text: "[if war.take == 0]Go on.[/if][if war.take == 1]Another tour.[/if]"
      # the tour page first, then the tour's story event, then the night's work (FRAME-PLAYTEST2 G):
